<script>
(() => {
  let theme = "dark";
  try {
    const savedTheme = localStorage.getItem("pdf-shelf-theme");
    if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
  } catch {}
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#ffffff" : "#101318";
})();
</script>

<style>
:root{
  color-scheme:dark;
  --bg:#101318;
  --panel:#171c23;
  --panel-2:#202834;
  --ink:#e6eaf0;
  --muted:#aab3c0;
  --faint:#9da8b8;
  --gold-rgb:var(--blue-rgb);
  --blue-rgb:145,168,199;
  --green-rgb:var(--blue-rgb);
  --line:rgba(var(--surface-rgb),.14);
  --line-strong:rgba(var(--surface-rgb),.28);
  --gold:rgb(var(--gold-rgb));
  --gold-soft:rgba(var(--gold-rgb),.10);
  --blue:rgb(var(--blue-rgb));
  --blue-soft:rgba(var(--blue-rgb),.11);
  --green:rgb(var(--green-rgb));
  --page-blue:transparent;
  --page-gold:transparent;
  --page-start:#101318;
  --page-end:#101318;
  --surface-rgb:255,255,255;
  --header-rgb:23,28,35;
  --tools-rgb:23,28,35;
  --item-rgb:23,28,35;
  --item-hover-rgb:32,40,52;
  --top-rgb:23,28,35;
  --input-bg:#101318;
  --link-bg:transparent;
  --meta-ink:var(--muted);
  --stat-ink:var(--ink);
  --index-ink:var(--muted);
  --blue-ink:#c0d0e5;
  --blue-hover-ink:#edf3fc;
  --tag-ink:#c0d0e5;
  --gold-ink:var(--blue-ink);
  --gold-hover-ink:var(--blue-hover-ink);
  --answer-hover-ink:var(--blue-hover-ink);
  --badge-ink:var(--blue-ink);
  --green-ink:var(--blue-ink);
  --green-hover-ink:var(--blue-hover-ink);
  --shadow:0 8px 24px rgba(0,0,0,.12);
  --tools-shadow:0 12px 34px rgba(0,0,0,.20);
  --item-shadow:none;
  --top-shadow:0 14px 36px rgba(0,0,0,.40);
}

:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff;
  --panel:#f8fafc;
  --panel-2:#eff4fa;
  --ink:#1b2028;
  --muted:#525e6b;
  --faint:#5d6876;
  --gold-rgb:var(--blue-rgb);
  --blue-rgb:52,93,138;
  --green-rgb:var(--blue-rgb);
  --page-blue:transparent;
  --page-gold:transparent;
  --page-start:#ffffff;
  --page-end:#ffffff;
  --surface-rgb:24,36,54;
  --header-rgb:248,250,252;
  --tools-rgb:248,250,252;
  --item-rgb:248,250,252;
  --item-hover-rgb:239,244,250;
  --top-rgb:248,250,252;
  --input-bg:#ffffff;
  --link-bg:transparent;
  --meta-ink:var(--muted);
  --stat-ink:var(--ink);
  --index-ink:var(--muted);
  --blue-ink:var(--blue);
  --blue-hover-ink:#24476f;
  --tag-ink:var(--blue);
  --gold-ink:var(--blue-ink);
  --gold-hover-ink:var(--blue-hover-ink);
  --answer-hover-ink:var(--blue-hover-ink);
  --badge-ink:var(--blue-ink);
  --green-ink:var(--blue-ink);
  --green-hover-ink:var(--blue-hover-ink);
  --shadow:0 8px 24px rgba(24,36,54,.04);
  --tools-shadow:0 12px 34px rgba(36,43,48,.07);
  --item-shadow:none;
  --top-shadow:0 14px 36px rgba(36,43,48,.12);
}

*{
  box-sizing:border-box;
}

[hidden]{
  display:none !important;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0, 0, 0, 0);
  white-space:nowrap;
  border:0;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:var(--bg);
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Times New Roman",
    serif;
  line-height:1.82;
  letter-spacing:.025em;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:min(640px, calc(100% - 34px));
  margin:0 auto;
  padding:54px 0 72px;
}

.site-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding-bottom:12px;
  margin-bottom:8px;
  border-bottom:1px solid var(--line);
}

.site-title{
  margin:0;
  color:var(--ink);
  font:400 20px/1.2 Georgia, "Times New Roman", serif;
  letter-spacing:.08em;
}

.theme-toggle{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:44px;
  min-height:44px;
  padding:10px;
  border:1px solid var(--line-strong);
  border-radius:0;
  color:var(--ink);
  background:var(--panel);
  font:500 12px/1.2 "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  letter-spacing:.04em;
  cursor:pointer;
}

.theme-toggle:hover{
  border-color:var(--blue);
  background:var(--blue-soft);
}

.theme-toggle svg{
  width:18px;
  height:18px;
  flex:none;
}

.theme-icon-moon,
:root[data-theme="light"] .theme-icon-sun{
  display:none;
}

:root[data-theme="light"] .theme-icon-moon{
  display:block;
}

/* Header */

.header{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:38px;
  align-items:stretch;
  padding:30px;
  border:1px solid var(--line-strong);
  border-radius:0;
  background:
    linear-gradient(135deg, rgba(var(--surface-rgb),.06), rgba(var(--surface-rgb),.02)),
    rgba(var(--header-rgb),.76);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  position:relative;
  overflow:hidden;
}

.header > *{
  min-width:0;
}

.header::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:3px;
  background:linear-gradient(90deg, var(--blue), var(--gold), transparent 72%);
}

.header::after{
  content:"";
  position:absolute;
  right:30px;
  bottom:24px;
  width:156px;
  height:156px;
  border:1px solid rgba(var(--gold-rgb),.20);
  transform:rotate(12deg);
  opacity:.55;
}

.kicker{
  margin:0 0 10px;
  color:var(--gold);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  letter-spacing:.22em;
  text-transform:uppercase;
}

h1{
  margin:0;
  font-size:clamp(76px, 9vw, 128px);
  line-height:.88;
  font-weight:500;
  letter-spacing:.045em;
  text-wrap:balance;
}

.hero-title{
  position:relative;
  z-index:1;
}

.lead{
  margin:0;
  max-width:440px;
  color:var(--muted);
  font-size:14px;
}

.hero-side{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:24px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
  margin-top:22px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.meta span{
  display:inline-flex;
  align-items:center;
  min-height:32px;
  padding:5px 12px;
  border:1px solid var(--line);
  background:rgba(var(--surface-rgb),.04);
  color:var(--meta-ink);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  margin-top:24px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.stat{
  min-height:76px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:0;
  background:rgba(var(--surface-rgb),.035);
  box-shadow:none;
}

.stat strong{
  display:block;
  color:var(--stat-ink);
  font-size:25px;
  line-height:1;
  font-weight:500;
  letter-spacing:0;
}

.stat span{
  display:block;
  margin-top:9px;
  color:var(--faint);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.stat .ok{
  color:var(--green);
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.nav a{
  display:inline-flex;
  align-items:center;
  min-height:32px;
  padding:5px 11px;
  border:1px solid rgba(var(--blue-rgb),.22);
  border-radius:0;
  color:var(--blue-ink);
  background:var(--blue-soft);
  font-size:12px;
  letter-spacing:.06em;
  transition:border-color .16s ease, background .16s ease, color .16s ease;
}

.nav a:hover{
  border-color:rgba(var(--blue-rgb),.58);
  background:rgba(var(--blue-rgb),.17);
  color:var(--blue-ink);
}








/* Section */

.section{
  padding:24px 0 4px;
  scroll-margin-top:24px;
}

.section-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.section-index,
.section-count{
  flex:0 0 auto;
  font-family:"Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  font-size:10px;
  line-height:1;
  letter-spacing:.16em;
}

.section-index{
  color:var(--index-ink);
}

.section-count{
  color:var(--faint);
}

.section-head h2{
  margin:0;
  color:var(--gold);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  font-weight:500;
  letter-spacing:.08em;
  text-transform:uppercase;
  white-space:nowrap;
}

.section-head::after{
  content:"";
  display:block;
  height:1px;
  flex:1;
  background:linear-gradient(90deg, var(--line-strong), rgba(var(--gold-rgb),.04));
}

.menu{
  border-top:1px solid var(--line);
}

/* Item */

.item{
  display:grid;
  grid-template-columns:32px minmax(0, 1fr) auto;
  gap:16px;
  align-items:center;
  min-height:76px;
  margin-top:8px;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  border-left:1px solid rgba(var(--surface-rgb),.055);
  border-radius:0;
  background:var(--panel);
  box-shadow:none;
  transition:
    transform .16s ease,
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.item:hover{
  border-bottom-color:var(--line-strong);
  border-left-color:rgba(var(--blue-rgb),.48);
  background:var(--panel-2);
  box-shadow:var(--item-shadow);
  transform:none;
}

.num{
  color:var(--index-ink);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:11px;
  letter-spacing:.08em;
}

.main{
  min-width:0;
}

.title{
  margin:0;
  font-family:"Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  font-size:16px;
  line-height:1.65;
  font-weight:500;
  letter-spacing:.015em;
  overflow-wrap:anywhere;
}

.desc{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.tag{
  display:inline-flex;
  align-items:center;
  min-height:21px;
  padding:2px 8px;
  border:1px solid rgba(var(--blue-rgb),.20);
  border-radius:0;
  background:rgba(var(--blue-rgb),.075);
  color:var(--tag-ink);
  font-size:10px;
  letter-spacing:.05em;
}

.badge{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid rgba(var(--gold-rgb),.36);
  border-radius:0;
  color:var(--badge-ink);
  background:rgba(var(--gold-rgb),.09);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.links{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:6px;
  min-width:0;
  margin-top:0;
  padding-top:0;
  border-top:0;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.links a,
.link-unavailable{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:30px;
  padding:5px 9px;
  border:1px solid rgba(var(--gold-rgb),.30);
  border-radius:0;
  background:var(--link-bg);
  color:var(--gold-ink);
  font-size:11px;
  line-height:1.4;
  letter-spacing:.04em;
  transition:
    border-color .16s ease,
    background .16s ease,
    color .16s ease;
}

.links a:hover{
  border-color:rgba(var(--blue-rgb),.70);
  background:rgba(var(--blue-rgb),.12);
  color:var(--gold-hover-ink);
}

.links a.link-question{
  border-color:rgba(var(--blue-rgb),.34);
  background:rgba(var(--blue-rgb),.065);
  color:var(--blue-ink);
}

.links a.link-question:hover{
  border-color:rgba(var(--blue-rgb),.74);
  background:rgba(var(--blue-rgb),.14);
  color:var(--blue-hover-ink);
}

.links a.link-answer{
  border-color:rgba(var(--gold-rgb),.38);
  background:rgba(var(--gold-rgb),.065);
  color:var(--gold-ink);
}

.links a.link-answer:hover{
  border-color:rgba(var(--gold-rgb),.72);
  background:rgba(var(--gold-rgb),.14);
  color:var(--answer-hover-ink);
}

.links a.link-teacher{
  border-color:rgba(var(--green-rgb),.34);
  background:rgba(var(--green-rgb),.06);
  color:var(--green-ink);
}

.links a.link-teacher:hover{
  border-color:rgba(var(--green-rgb),.70);
  background:rgba(var(--green-rgb),.13);
  color:var(--green-hover-ink);
}

.link-unavailable{
  border-color:rgba(var(--surface-rgb),.12);
  background:rgba(var(--surface-rgb),.035);
  color:var(--faint);
  cursor:not-allowed;
}

.link-status{
  margin-left:7px;
  color:var(--green);
  font-size:10px;
  letter-spacing:.08em;
}

.link-unavailable .link-status{
  color:var(--faint);
}

.nav a:focus-visible,
.links a:focus-visible,
.theme-toggle:focus-visible,
.back-to-top:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:3px;
}


/* Footer */

.footer{
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin-top:44px;
  padding-top:20px;
  border-top:1px solid var(--line-strong);
  color:var(--faint);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.back-to-top{
  position:fixed;
  right:max(18px, env(safe-area-inset-right));
  bottom:max(18px, env(safe-area-inset-bottom));
  z-index:30;
  min-width:48px;
  min-height:48px;
  padding:8px 11px;
  border:1px solid rgba(var(--blue-rgb),.42);
  border-radius:0;
  color:var(--blue-ink);
  background:rgba(var(--top-rgb),.92);
  box-shadow:var(--top-shadow);
  backdrop-filter:blur(14px);
  font:600 10px/1.2 "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  letter-spacing:.08em;
  cursor:pointer;
}

.back-to-top:hover{
  border-color:rgba(var(--blue-rgb),.72);
  background:rgba(var(--blue-rgb),.13);
}

/* Responsive */

@media (max-width:820px){
  .header{
    grid-template-columns:1fr;
    gap:22px;
  }

  .meta{
    justify-content:flex-start;
  }

  .lead{
    max-width:620px;
  }



  .item{
    grid-template-columns:28px minmax(0, 1fr);
    gap:12px;
  }

  .links{
    grid-column:2;
    min-width:0;
    justify-content:flex-start;
  }
}

@media (max-width:540px){
  .wrap{
    width:min(100% - 24px, 640px);
    padding:34px 0 54px;
  }

  .header{
    padding:22px;
    border-radius:0;
  }

  h1{
    font-size:64px;
    letter-spacing:.035em;
  }

  .section-head{
    gap:9px;
  }

  .section-index,
  .section-count{
    font-size:9px;
    letter-spacing:.10em;
  }

  .nav{
    flex-wrap:nowrap;
    overflow-x:auto;
    margin-right:-24px;
    padding-right:24px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }

  .nav::-webkit-scrollbar{
    display:none;
  }

  .nav a{
    flex:0 0 auto;
  }

  .stats{
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:7px;
  }

  .stat{
    min-height:68px;
    padding:11px 10px;
    border-radius:0;
  }

  .stat strong{
    font-size:22px;
  }

  .stat span{
    margin-top:8px;
    font-size:9px;
    letter-spacing:.08em;
  }

  .meta{
    display:none;
  }

  .item{
    grid-template-columns:24px minmax(0, 1fr);
    gap:8px 10px;
    align-items:start;
    min-height:0;
    padding:14px;
    border-radius:0;
  }

  .title{
    font-size:15px;
  }

  .num{
    line-height:24.75px;
  }

  .links{
    grid-column:2;
    margin-top:0;
  }

  .links a,
  .link-unavailable{
    width:auto;
    min-width:0;
    text-align:center;
    line-height:1.35;
  }

  .footer{
    flex-direction:column;
  }
}

@media (prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  .item,
  .links a{
    transition:none;
  }
}
</style>
</head>

      </svg>

  <main id="archive"></main>

<script>
const themeToggle = document.getElementById("theme-toggle");
const updateThemeToggle = () => {
  const nextMode = document.documentElement.dataset.theme === "light" ? "ダークモード" : "ライトモード";
  themeToggle.setAttribute("aria-label", `${nextMode}に切り替える`);
};

themeToggle.addEventListener("click", () => {
  const theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#ffffff" : "#101318";
  try {
    localStorage.setItem("pdf-shelf-theme", theme);
  } catch {}
  updateThemeToggle();
});
updateThemeToggle();
themeToggle.hidden = false;

const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  "\"": "&quot;",
  "'": "&#39;"
}[ch]));

const getLinkKind = (label) => {
  const text = String(label ?? "");
  if (text.includes("講師用")) return "teacher";
  if (/(解答|答え|英語あり)/.test(text)) return "answer";
  if (/(問題|生徒用|練習|英語なし|チェック|クイズ|テスト)/.test(text)) return "question";
  return "other";
};

const createLink = (link) => {
  const available = link.available !== false;
  const element = document.createElement(available ? "a" : "span");
  element.classList.add(`link-${getLinkKind(link.label)}`);
  element.append(document.createTextNode(link.label));

  if (available) {
    element.href = link.href;
  } else {
    element.className = "link-unavailable";
    element.setAttribute("aria-disabled", "true");
    element.title = "PDFファイルが未配置です";

    const status = document.createElement("span");
    status.className = "link-status";
    status.textContent = "未配置";
    element.appendChild(status);
  }

  return element;
};

const renderArchive = (sections) => {
  const archive = document.getElementById("archive");
  archive.innerHTML = "";

  let count = 1;

  sections.forEach((section, sectionIndex) => {
    const sectionEl = document.createElement("section");
    sectionEl.className = "section";
    sectionEl.id = section.id;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML =
      `<span class="section-index" aria-hidden="true">${String(sectionIndex + 1).padStart(2, "0")}</span>` +
      `<h2>${escapeHtml(section.label)}</h2>` +
      `<span class="section-count">${section.items.length} ITEMS</span>`;

    const menu = document.createElement("div");
    menu.className = "menu";

    section.items.forEach((item) => {
      const article = document.createElement("article");
      article.className = "item";

      const num = document.createElement("div");
      num.className = "num";
      num.setAttribute("aria-hidden", "true");
      num.textContent = String(count).padStart(2, "0");
      count += 1;

      const main = document.createElement("div");
      main.className = "main";

      const title = document.createElement("h3");
      title.className = "title";
      title.append(document.createTextNode(item.title || ""));

      main.appendChild(title);

      const links = document.createElement("div");
      links.className = "links";
      (item.links || []).forEach((link) => links.appendChild(createLink(link)));

      article.append(num, main, links);
      menu.appendChild(article);
    });

    sectionEl.append(head, menu);
    archive.appendChild(sectionEl);
  });

};

const backToTop = document.getElementById("back-to-top");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const updateBackToTop = () => {
  backToTop.hidden = window.scrollY < 640;
};

window.addEventListener("scroll", updateBackToTop, { passive: true });
backToTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: reduceMotion.matches ? "auto" : "smooth" });
});
updateBackToTop();

fetch("./materials.json")
  .then((response) => {
    if (!response.ok) throw new Error(`materials.json: ${response.status}`);
    return response.json();
  })
  .then(renderArchive)
  .catch((error) => {
    const fallback = document.getElementById("materials-fallback");
    if (fallback?.textContent) {
      renderArchive(JSON.parse(fallback.textContent));
      console.warn("materials.json could not be fetched; using embedded fallback.", error);
      return;
    }

    document.getElementById("archive").innerHTML =
      `<section class="section"><div class="section-head"><h2>Error</h2></div><p class="desc">materials.json を読み込めませんでした。</p></section>`;
    console.error(error);
  });
</script>
</body>
