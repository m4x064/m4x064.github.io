<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDFおきば</title>
<meta name="description" content="数学プリント・模試・確認教材を整理した、的場のPDF教材保管庫。" />
<meta name="theme-color" content="#070809" />
<meta name="color-scheme" content="dark" />
<link rel="canonical" href="https://m4x064.github.io/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="PDFおきば" />
<meta property="og:description" content="数学プリント・模試・確認教材を整理した、的場のPDF教材保管庫。" />
<meta property="og:url" content="https://m4x064.github.io/" />
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" type="180x180" href="apple-touch-icon.png">

<style>
:root{
  --bg:#08090c;
  --panel:#111217;
  --panel-2:#17181e;
  --ink:#f4f1eb;
  --muted:#aaa8ae;
  --faint:#8b867f;
  --line:rgba(218,213,228,.13);
  --line-strong:rgba(218,211,232,.27);
  --gold:#dfcfaa;
  --gold-soft:rgba(223,207,170,.09);
  --blue:#9edcff;
  --blue-soft:rgba(158,220,255,.09);
  --violet:#c8b8f2;
  --violet-soft:rgba(200,184,242,.08);
  --green:#97e0b8;
  --shadow:0 28px 90px rgba(0,0,0,.42);
}

*{
  box-sizing:border-box;
}

[hidden]{
  display:none !important;
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0, 0, 0, 0);
  white-space:nowrap;
  border:0;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% -8%, rgba(158,220,255,.13), transparent 32rem),
    radial-gradient(circle at 92% 12%, rgba(200,184,242,.10), transparent 28rem),
    radial-gradient(circle at 52% 96%, rgba(223,207,170,.065), transparent 34rem),
    linear-gradient(180deg, #07080b 0%, var(--bg) 48%, #0b0a0d 100%);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  line-height:1.75;
  letter-spacing:.03em;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.78), transparent 72%);
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:min(1180px, calc(100% - 40px));
  margin:0 auto;
  padding:48px 0 72px;
}

/* Header */

.header{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:54px;
  align-items:stretch;
  padding:42px;
  border:1px solid var(--line);
  border-radius:26px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.018) 58%, rgba(200,184,242,.025)),
    rgba(13,14,18,.76);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    var(--shadow);
  backdrop-filter:blur(22px);
  position:relative;
  overflow:hidden;
}

.header > *{
  min-width:0;
}

.header::before{
  content:"";
  position:absolute;
  left:42px;
  top:0;
  width:180px;
  height:1px;
  background:linear-gradient(90deg, var(--blue), var(--violet), transparent);
}

.header::after{
  content:"✦";
  position:absolute;
  right:34px;
  top:24px;
  color:var(--violet);
  font-size:15px;
  line-height:1;
  opacity:.65;
}

.kicker{
  margin:0 0 20px;
  color:var(--violet);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:11px;
  letter-spacing:.26em;
  text-transform:uppercase;
}

h1{
  margin:0;
  font-family:Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
  font-size:clamp(54px, 7vw, 92px);
  line-height:.94;
  font-weight:400;
  letter-spacing:.015em;
  text-wrap:balance;
}

.hero-title{
  position:relative;
  z-index:1;
}

.lead{
  margin:0;
  max-width:440px;
  color:#b6b3ba;
  font-size:13px;
  line-height:1.95;
  letter-spacing:.055em;
}

.hero-side{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:26px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-start;
  gap:16px;
  margin-top:0;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.meta span{
  display:inline-flex;
  align-items:center;
  min-height:auto;
  padding:0;
  border:0;
  background:transparent;
  color:var(--faint);
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:9px;
  margin-top:0;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.stat{
  min-height:78px;
  padding:15px 16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.032);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055);
}

.stat strong{
  display:block;
  color:var(--ink);
  font-size:25px;
  line-height:1;
  font-weight:500;
  letter-spacing:0;
}

.stat span{
  display:block;
  margin-top:9px;
  color:var(--faint);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.stat .ok{
  color:var(--green);
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:30px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.nav a{
  display:inline-flex;
  align-items:center;
  min-height:34px;
  padding:6px 13px;
  border:1px solid rgba(158,220,255,.18);
  border-radius:999px;
  color:#d9edf8;
  background:rgba(158,220,255,.055);
  font-size:11px;
  letter-spacing:.075em;
  transition:border-color .16s ease, background .16s ease, color .16s ease;
}

.nav a:hover{
  border-color:rgba(200,184,242,.46);
  background:rgba(200,184,242,.10);
  color:#f3edff;
}

.tools{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:center;
  margin:22px 0 0;
  padding:10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(13,14,18,.86);
  backdrop-filter:blur(20px);
  position:sticky;
  top:8px;
  z-index:20;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 14px 38px rgba(0,0,0,.20);
}

.search-wrap{
  position:relative;
}

.search{
  width:100%;
  min-height:46px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:10px;
  background:rgba(4,5,7,.48);
  color:var(--ink);
  padding:0 78px 0 14px;
  font:500 14px/1.2 "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  outline:none;
}

.search:focus{
  border-color:rgba(118,209,255,.56);
  box-shadow:0 0 0 3px rgba(118,209,255,.11);
}

.clear-search{
  position:absolute;
  right:6px;
  top:50%;
  min-height:32px;
  padding:4px 10px;
  border:0;
  border-radius:999px;
  color:var(--muted);
  background:rgba(255,255,255,.07);
  font:500 11px/1 "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  letter-spacing:.08em;
  cursor:pointer;
  transform:translateY(-50%);
}

.clear-search:hover{
  color:var(--ink);
  background:rgba(118,209,255,.12);
}

.result-count{
  color:var(--muted);
  font-family:"Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
  white-space:nowrap;
}

/* Section */

.section{
  padding:46px 0 0;
  scroll-margin-top:86px;
}

.section-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}

.section-head::before{
  content:attr(data-number);
  color:rgba(158,220,255,.68);
  font:500 10px/1 "Helvetica Neue", Arial, sans-serif;
  letter-spacing:.18em;
}

.section-head h2{
  margin:0;
  color:#d7d3dc;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:11px;
  font-weight:500;
  letter-spacing:.20em;
  text-transform:uppercase;
  white-space:nowrap;
}

.section-head::after{
  content:"";
  display:block;
  height:1px;
  flex:1;
  background:linear-gradient(90deg, var(--line-strong), rgba(200,184,242,.025));
}

.menu{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:16px;
}

/* Item */

.item{
  display:grid;
  grid-template-columns:42px 1fr;
  grid-template-rows:auto 1fr;
  gap:8px 16px;
  align-items:start;
  min-height:214px;
  margin:0;
  padding:23px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.014) 64%, rgba(200,184,242,.018)),
    rgba(13,14,18,.56);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055);
  transition:
    transform .16s ease,
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.item:hover{
  border-color:rgba(200,184,242,.32);
  background:
    linear-gradient(145deg, rgba(158,220,255,.075), rgba(255,255,255,.025) 48%, rgba(200,184,242,.055)),
    rgba(16,17,22,.88);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.075),
    0 18px 52px rgba(0,0,0,.26);
  transform:translateY(-3px);
}

.num{
  color:rgba(158,220,255,.70);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  letter-spacing:.20em;
}

.main{
  min-width:0;
}

.title{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  margin:0;
  font-family:Georgia, "Yu Mincho", "Hiragino Mincho ProN", serif;
  font-size:22px;
  line-height:1.35;
  font-weight:400;
  letter-spacing:.025em;
}

.desc{
  margin:8px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.78;
  letter-spacing:.035em;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:13px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.tag{
  display:inline-flex;
  align-items:center;
  min-height:21px;
  padding:2px 9px;
  border:1px solid rgba(158,220,255,.13);
  border-radius:999px;
  background:rgba(158,220,255,.045);
  color:#bcd7e5;
  font-size:9px;
  letter-spacing:.05em;
}

.badge{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 9px;
  border:1px solid rgba(200,184,242,.28);
  border-radius:999px;
  color:#e2d9fb;
  background:rgba(200,184,242,.07);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.links{
  display:flex;
  flex-wrap:wrap;
  grid-column:1 / -1;
  align-self:end;
  justify-content:flex-start;
  gap:8px;
  min-width:0;
  margin-top:10px;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.055);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.links a,
.link-unavailable{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:7px 13px;
  border:1px solid rgba(223,207,170,.20);
  border-radius:999px;
  background:rgba(4,5,7,.32);
  color:#eadab7;
  font-size:11px;
  letter-spacing:.04em;
  transition:
    border-color .16s ease,
    background .16s ease,
    color .16s ease,
    transform .16s ease;
}

.links a:hover{
  border-color:rgba(158,220,255,.48);
  background:rgba(158,220,255,.09);
  color:#f4f0e7;
  transform:translateY(-1px);
}

.link-unavailable{
  border-color:rgba(255,255,255,.12);
  background:rgba(255,255,255,.035);
  color:var(--faint);
  cursor:not-allowed;
}

.link-status{
  margin-left:7px;
  color:var(--green);
  font-size:10px;
  letter-spacing:.08em;
}

.link-unavailable .link-status{
  color:var(--faint);
}

.nav a:focus-visible,
.links a:focus-visible,
.clear-search:focus-visible,
.back-to-top:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:3px;
}

.empty{
  display:none;
  margin-top:22px;
  padding:24px;
  border:1px solid var(--line);
  border-radius:16px;
  color:var(--muted);
  background:rgba(255,255,255,.03);
  font-size:13px;
}

/* Footer */

.footer{
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin-top:44px;
  padding-top:20px;
  border-top:1px solid var(--line);
  color:var(--faint);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.back-to-top{
  position:fixed;
  right:max(18px, env(safe-area-inset-right));
  bottom:max(18px, env(safe-area-inset-bottom));
  z-index:30;
  min-width:48px;
  min-height:48px;
  padding:8px 11px;
  border:1px solid rgba(158,220,255,.32);
  border-radius:999px;
  color:#dff4ff;
  background:rgba(8,10,11,.92);
  box-shadow:0 14px 36px rgba(0,0,0,.40);
  backdrop-filter:blur(14px);
  font:600 10px/1.2 "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  letter-spacing:.08em;
  cursor:pointer;
}

.back-to-top:hover{
  border-color:rgba(200,184,242,.58);
  background:rgba(200,184,242,.12);
}

/* Responsive */

@media (max-width:820px){
  .header{
    grid-template-columns:1fr;
    gap:22px;
    padding:32px;
  }

  .meta{
    justify-content:flex-start;
  }

  .lead{
    max-width:620px;
  }

  .tools{
    grid-template-columns:minmax(0, 1fr) auto;
    gap:8px;
  }

  .result-count{
    padding-right:2px;
    font-size:10px;
    letter-spacing:.08em;
    white-space:nowrap;
  }

  .item{
    grid-template-columns:64px 1fr;
    gap:14px;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .links{
    grid-column:2;
    min-width:0;
    justify-content:flex-start;
  }
}

@media (max-width:540px){
  .wrap{
    width:min(100% - 24px, 1040px);
    padding:34px 0 54px;
  }

  .header{
    padding:24px;
    border-radius:18px;
  }

  h1{
    font-size:48px;
    letter-spacing:0;
  }

  .nav{
    flex-wrap:nowrap;
    overflow-x:auto;
    margin-right:-24px;
    padding-right:24px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }

  .nav::-webkit-scrollbar{
    display:none;
  }

  .nav a{
    flex:0 0 auto;
  }

  .stats{
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:7px;
  }

  .stat{
    min-height:68px;
    padding:11px 10px;
    border-radius:12px;
  }

  .stat strong{
    font-size:22px;
  }

  .stat span{
    margin-top:8px;
    font-size:9px;
    letter-spacing:.08em;
  }

  .meta{
    display:none;
  }

  .item{
    grid-template-columns:1fr;
    gap:8px;
    min-height:0;
    padding:20px;
    border-radius:16px;
  }

  .links{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(145px, 1fr));
    grid-column:auto;
    margin-top:6px;
    width:100%;
  }

  .links a,
  .link-unavailable{
    width:auto;
    min-height:44px;
    min-width:0;
    text-align:center;
    line-height:1.35;
  }

  .footer{
    flex-direction:column;
  }
}

@media (prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  .item,
  .links a{
    transition:none;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <div>
      <p class="kicker">m4x064 / PDF Shelf</p>
      <h1 class="hero-title">PDF<br>おきば</h1>

      <nav class="nav" aria-label="ページ内カテゴリ" id="nav"></nav>
    </div>

    <div class="hero-side">
      <p class="lead">
        数学プリント・模試・確認教材を静かに整理しておくための教材目録。
        必要なPDFへ、すばやく、迷わずアクセスできます。
      </p>

      <div class="stats" aria-label="保管庫の概要">
        <div class="stat"><strong id="stat-sections">0</strong><span>カテゴリ</span></div>
        <div class="stat"><strong id="stat-items">0</strong><span>教材</span></div>
        <div class="stat"><strong id="stat-links">0</strong><span>PDF</span></div>
      </div>

      <div class="meta">
        <span>Mathematics</span>
        <span>Handouts</span>
        <span>Archive</span>
      </div>
    </div>
  </header>

  <div class="tools" role="search">
    <div class="search-wrap">
      <label class="sr-only" for="search">教材名・説明・カテゴリを検索</label>
      <input class="search" id="search" type="search" placeholder="教材を検索" autocomplete="off">
      <button class="clear-search" id="clear-search" type="button" hidden>クリア</button>
    </div>
    <div class="result-count" id="result-count" role="status" aria-live="polite" aria-atomic="true">読み込み中</div>
  </div>

  <main id="archive"></main>
  <p class="empty" id="empty">該当する教材が見つかりませんでした。</p>

  <footer class="footer">
    <span>m4x064.github.io</span>
    <span>Matoba Mathematics Archive</span>
  </footer>

</div>

<script>
const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  "\"": "&quot;",
  "'": "&#39;"
}[ch]));

const normalizeSearch = (value) => String(value ?? "")
  .normalize("NFKC")
  .toLocaleLowerCase("ja")
  .replace(/[‐‑‒–—―−]/g, "-")
  .replace(/-+/g, "-")
  .replace(/\s+/g, " ")
  .trim();

const createLink = (link) => {
  const available = link.available !== false;
  const element = document.createElement(available ? "a" : "span");
  element.append(document.createTextNode(link.label));

  if (available) {
    element.href = link.href;
  } else {
    element.className = "link-unavailable";
    element.setAttribute("aria-disabled", "true");
    element.title = "PDFファイルが未配置です";

    const status = document.createElement("span");
    status.className = "link-status";
    status.textContent = "未配置";
    element.appendChild(status);
  }

  return element;
};

const renderArchive = (sections) => {
  const nav = document.getElementById("nav");
  const archive = document.getElementById("archive");
  const search = document.getElementById("search");
  const clearSearch = document.getElementById("clear-search");
  const resultCount = document.getElementById("result-count");
  const empty = document.getElementById("empty");
  nav.innerHTML = "";
  archive.innerHTML = "";

  let count = 1;
  let linkCount = 0;
  const entries = [];

  sections.forEach((section, sectionIndex) => {
    const navLink = document.createElement("a");
    navLink.href = `#${section.id}`;
    navLink.textContent = section.nav || section.label;
    nav.appendChild(navLink);

    const sectionEl = document.createElement("section");
    sectionEl.className = "section";
    sectionEl.id = section.id;

    const head = document.createElement("div");
    head.className = "section-head";
    head.dataset.number = String(sectionIndex + 1).padStart(2, "0");
    head.innerHTML = `<h2>${escapeHtml(section.label)}</h2>`;

    const menu = document.createElement("div");
    menu.className = "menu";

    section.items.forEach((item) => {
      linkCount += (item.links || []).length;
      const article = document.createElement("article");
      article.className = "item";
      article.dataset.search = normalizeSearch([
        section.label,
        section.nav,
        item.title,
        item.description,
        item.badge,
        ...(item.tags || []),
        ...(item.links || []).map((link) => `${link.label} ${link.href}`)
      ].join(" "));

      const num = document.createElement("div");
      num.className = "num";
      num.setAttribute("aria-hidden", "true");
      num.textContent = String(count).padStart(2, "0");
      count += 1;

      const main = document.createElement("div");
      main.className = "main";

      const title = document.createElement("h3");
      title.className = "title";
      title.append(document.createTextNode(item.title || ""));

      if (item.badge) {
        title.append(document.createTextNode(" "));
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = item.badge;
        title.appendChild(badge);
      }

      const desc = document.createElement("p");
      desc.className = "desc";
      desc.textContent = item.description || "";

      main.append(title, desc);

      if (item.tags?.length) {
        const tags = document.createElement("div");
        tags.className = "tags";
        item.tags.forEach((tagLabel) => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = tagLabel;
          tags.appendChild(tag);
        });
        main.appendChild(tags);
      }

      const links = document.createElement("div");
      links.className = "links";
      (item.links || []).forEach((link) => links.appendChild(createLink(link)));

      article.append(num, main, links);
      menu.appendChild(article);
      entries.push({ article, sectionEl });
    });

    sectionEl.append(head, menu);
    archive.appendChild(sectionEl);
  });

  const itemCount = entries.length;
  document.getElementById("stat-sections").textContent = sections.length;
  document.getElementById("stat-items").textContent = itemCount;
  document.getElementById("stat-links").textContent = linkCount;

  const updateFilter = () => {
    const query = normalizeSearch(search.value);
    const tokens = query.split(" ").filter(Boolean);
    let visibleCount = 0;

    entries.forEach(({ article }) => {
      const visible = !tokens.length || tokens.every((token) => article.dataset.search.includes(token));
      article.hidden = !visible;
      if (visible) visibleCount += 1;
    });

    sections.forEach((section) => {
      const sectionEl = document.getElementById(section.id);
      const hasVisibleItems = [...sectionEl.querySelectorAll(".item")].some((item) => !item.hidden);
      sectionEl.hidden = !hasVisibleItems;
    });

    resultCount.textContent = query
      ? `${visibleCount} / ${itemCount} 件`
      : `${itemCount} 件の教材`;
    empty.style.display = visibleCount ? "none" : "block";
    clearSearch.hidden = !query;
  };

  search.addEventListener("input", updateFilter);
  clearSearch.addEventListener("click", () => {
    search.value = "";
    updateFilter();
    search.focus();
  });
  updateFilter();
};

const backToTop = document.getElementById("back-to-top");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const updateBackToTop = () => {
  backToTop.hidden = window.scrollY < 640;
};

window.addEventListener("scroll", updateBackToTop, { passive: true });
backToTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: reduceMotion.matches ? "auto" : "smooth" });
});
updateBackToTop();

fetch("./materials.json")
  .then((response) => {
    if (!response.ok) throw new Error(`materials.json: ${response.status}`);
    return response.json();
  })
  .then(renderArchive)
  .catch((error) => {
    const fallback = document.getElementById("materials-fallback");
    if (fallback?.textContent) {
      renderArchive(JSON.parse(fallback.textContent));
      console.warn("materials.json could not be fetched; using embedded fallback.", error);
      return;
    }

    document.getElementById("archive").innerHTML =
      `<section class="section"><div class="section-head"><h2>Error</h2></div><p class="desc">materials.json を読み込めませんでした。</p></section>`;
    console.error(error);
  });
</script>
</body>
