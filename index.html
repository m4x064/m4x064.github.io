<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF保管庫 的場</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" type="180x180" href="apple-touch-icon.png">

<style>
:root{
  --bg:#070809;
  --panel:#101214;
  --panel-2:#15181b;
  --ink:#f3efe7;
  --muted:#b0aa9f;
  --faint:#746f67;
  --line:rgba(224,204,156,.20);
  --line-strong:rgba(224,204,156,.50);
  --gold:#e0cc9c;
  --gold-soft:rgba(224,204,156,.10);
  --blue:#76d1ff;
  --blue-soft:rgba(118,209,255,.11);
  --green:#97e0b8;
  --shadow:0 26px 90px rgba(0,0,0,.48);
}

*{
  box-sizing:border-box;
}

[hidden]{
  display:none !important;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    linear-gradient(115deg, rgba(118,209,255,.08), transparent 32%),
    linear-gradient(245deg, rgba(224,204,156,.10), transparent 30%),
    linear-gradient(180deg, #030405 0%, var(--bg) 44%, #0d0b08 100%);
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Times New Roman",
    serif;
  line-height:1.82;
  letter-spacing:.025em;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.027) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:linear-gradient(180deg, rgba(0,0,0,.82), transparent 76%);
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:min(1120px, calc(100% - 34px));
  margin:0 auto;
  padding:54px 0 72px;
}

/* Header */

.header{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:38px;
  align-items:stretch;
  padding:30px;
  border:1px solid var(--line-strong);
  background:
    linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
    rgba(9,10,10,.76);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  position:relative;
  overflow:hidden;
}

.header::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:3px;
  background:linear-gradient(90deg, var(--blue), var(--gold), transparent 72%);
}

.header::after{
  content:"";
  position:absolute;
  right:30px;
  bottom:24px;
  width:156px;
  height:156px;
  border:1px solid rgba(224,204,156,.20);
  transform:rotate(12deg);
  opacity:.55;
}

.kicker{
  margin:0 0 14px;
  color:var(--gold);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  letter-spacing:.22em;
  text-transform:uppercase;
}

h1{
  margin:0;
  font-size:clamp(42px, 6.5vw, 86px);
  line-height:1.02;
  font-weight:500;
  letter-spacing:.03em;
  text-wrap:balance;
}

.hero-title{
  position:relative;
  z-index:1;
}

.lead{
  margin:0;
  max-width:440px;
  color:var(--muted);
  font-size:14px;
}

.hero-side{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:24px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
  margin-top:22px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.meta span{
  display:inline-flex;
  align-items:center;
  min-height:32px;
  padding:5px 12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:#d8d0c2;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  margin-top:24px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.stat{
  min-height:76px;
  padding:13px 14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
}

.stat strong{
  display:block;
  color:#fff7df;
  font-size:25px;
  line-height:1;
  font-weight:500;
  letter-spacing:0;
}

.stat span{
  display:block;
  margin-top:9px;
  color:var(--faint);
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:22px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.nav a{
  display:inline-flex;
  align-items:center;
  min-height:32px;
  padding:5px 11px;
  border:1px solid rgba(118,209,255,.22);
  color:#dff4ff;
  background:var(--blue-soft);
  font-size:12px;
  letter-spacing:.06em;
}

.nav a:hover{
  border-color:rgba(118,209,255,.58);
  background:rgba(118,209,255,.17);
}

.tools{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:center;
  margin:28px 0 0;
  padding:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
}

.search{
  width:100%;
  min-height:44px;
  border:1px solid rgba(255,255,255,.08);
  background:#080a0b;
  color:var(--ink);
  padding:0 14px;
  font:500 14px/1.2 "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  outline:none;
}

.search:focus{
  border-color:rgba(118,209,255,.56);
  box-shadow:0 0 0 3px rgba(118,209,255,.11);
}

.result-count{
  color:var(--muted);
  font-family:"Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  font-size:11px;
  letter-spacing:.13em;
  text-transform:uppercase;
  white-space:nowrap;
}

/* Section */

.section{
  padding:36px 0 4px;
}

.section-head{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  color:var(--gold);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  white-space:nowrap;
}

.section-head::after{
  content:"";
  display:block;
  height:1px;
  flex:1;
  background:linear-gradient(90deg, var(--line-strong), rgba(214,184,112,.04));
}

.menu{
  border-top:1px solid var(--line);
}

/* Item */

.item{
  display:grid;
  grid-template-columns:72px 1fr auto;
  gap:22px;
  align-items:center;
  min-height:94px;
  margin-top:10px;
  padding:18px;
  border-bottom:1px solid var(--line);
  border-left:1px solid rgba(255,255,255,.055);
  background:
    linear-gradient(90deg, rgba(255,255,255,.045), rgba(255,255,255,.015)),
    rgba(9,10,10,.50);
  transition:
    transform .16s ease,
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;
}

.item:hover{
  border-bottom-color:var(--line-strong);
  border-left-color:rgba(118,209,255,.48);
  background:
    linear-gradient(90deg, rgba(118,209,255,.10), rgba(224,204,156,.045) 58%, transparent),
    rgba(14,16,18,.86);
  box-shadow:0 18px 44px rgba(0,0,0,.30);
  transform:translateY(-2px);
}

.num{
  color:rgba(118,209,255,.76);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  letter-spacing:.20em;
}

.main{
  min-width:0;
}

.title{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  margin:0;
  font-size:22px;
  line-height:1.35;
  font-weight:500;
  letter-spacing:.04em;
}

.desc{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

.badge{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid rgba(214,184,112,.36);
  color:#fff1bf;
  background:rgba(224,204,156,.09);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.links{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
  min-width:260px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.links a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:7px 11px;
  border:1px solid rgba(224,204,156,.30);
  background:#0b0d0e;
  color:#f3dfac;
  font-size:12px;
  letter-spacing:.04em;
  transition:
    border-color .16s ease,
    background .16s ease,
    color .16s ease;
}

.links a:hover{
  border-color:rgba(118,209,255,.70);
  background:rgba(118,209,255,.12);
  color:#fff2ca;
}

.empty{
  display:none;
  margin-top:22px;
  padding:24px;
  border:1px solid var(--line);
  color:var(--muted);
  background:rgba(255,255,255,.03);
  font-size:13px;
}

/* Footer */

.footer{
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin-top:44px;
  padding-top:20px;
  border-top:1px solid var(--line-strong);
  color:var(--faint);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

/* Responsive */

@media (max-width:820px){
  .header{
    grid-template-columns:1fr;
    gap:22px;
  }

  .meta{
    justify-content:flex-start;
  }

  .lead{
    max-width:620px;
  }

  .tools{
    grid-template-columns:1fr;
  }

  .result-count{
    white-space:normal;
  }

  .item{
    grid-template-columns:64px 1fr;
    gap:14px;
  }

  .links{
    grid-column:2;
    min-width:0;
    justify-content:flex-start;
  }
}

@media (max-width:540px){
  .wrap{
    width:min(100% - 24px, 1040px);
    padding:34px 0 54px;
  }

  .header{
    padding-top:30px;
  }

  h1{
    font-size:42px;
    letter-spacing:0;
  }

  .header{
    padding:22px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .item{
    grid-template-columns:1fr;
    gap:6px;
    padding:16px;
  }

  .links{
    grid-column:auto;
    margin-top:6px;
  }

  .links a{
    width:100%;
  }

  .footer{
    flex-direction:column;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <div>
      <p class="kicker">Matoba Mathematics Archive</p>
      <h1 class="hero-title">PDF保管庫<br>的場</h1>

      <nav class="nav" aria-label="ページ内カテゴリ" id="nav"></nav>
    </div>

    <div class="hero-side">
      <p class="lead">
        数学プリント・模試・確認教材を静かに整理しておくための教材目録。
        必要なPDFへ、すばやく、迷わずアクセスできます。
      </p>

      <div class="stats" aria-label="保管庫の概要">
        <div class="stat"><strong id="stat-sections">0</strong><span>Sections</span></div>
        <div class="stat"><strong id="stat-items">0</strong><span>Materials</span></div>
        <div class="stat"><strong id="stat-links">0</strong><span>PDF Links</span></div>
      </div>

      <div class="meta">
        <span>Mathematics</span>
        <span>Handouts</span>
        <span>Archive</span>
      </div>
    </div>
  </header>

  <div class="tools" role="search">
    <input class="search" id="search" type="search" placeholder="教材名・説明・カテゴリを検索" autocomplete="off">
    <div class="result-count" id="result-count">Loading archive</div>
  </div>

  <main id="archive"></main>
  <p class="empty" id="empty">該当する教材が見つかりませんでした。</p>

  <footer class="footer">
    <span>m4x064.github.io</span>
    <span>Matoba Mathematics Archive</span>
  </footer>

</div>

<script type="application/json" id="materials-fallback">[{"id":"basic","label":"Basic Materials","nav":"基本教材","items":[{"title":"5/12","badge":"new","description":"存在領域・接線と中点の教材。","links":[{"label":"存在領域 問題","href":"./pdf/sonzai_ryouiki_problem.pdf"},{"label":"存在領域 解答","href":"./pdf/sonzai_ryouiki_answer.pdf"},{"label":"接線・中点・面積","href":"./pdf/tangent_midpoint_area.pdf"},{"label":"接線・中点","href":"./pdf/tangent_mid.pdf"}]},{"title":"4/10","badge":"basic","description":"基本プリント一式。","links":[{"label":"sinPDF","href":"./pdf/sin.pdf"},{"label":"allPDF","href":"./pdf/all.pdf"},{"label":"rikkei_allPDF","href":"./pdf/rikkei_all.pdf"}]},{"title":"単語帳","badge":"words","description":"単語帳と練習帳。","links":[{"label":"単語帳PDF","href":"./pdf/minimal_phrases.pdf"},{"label":"練習帳PDF","href":"./pdf/phrases_table.pdf"}]},{"title":"成績表","badge":"record","description":"成績確認用PDF。","links":[{"label":"成績表PDF","href":"./pdf/hyou.pdf"}]}]},{"id":"mock","label":"Mock Exams","nav":"模試","items":[{"title":"模試","badge":"mock","description":"模試教材。","links":[{"label":"模試PDF","href":"./pdf/mosi_2.pdf"}]},{"title":"模試","badge":"mock","description":"追加の模試教材。","links":[{"label":"模試PDF","href":"./pdf/mosi_3.pdf"}]}]},{"id":"check","label":"Check Sheets","nav":"確認教材","items":[{"title":"組み分け","badge":"check","description":"組み分け確認プリント。","links":[{"label":"チェックPDF","href":"./pdf/combination_check.pdf"}]},{"title":"正四面体","badge":"geometry","description":"空間図形チェック。","links":[{"label":"チェックPDF","href":"./pdf/tetra_check.pdf"}]},{"title":"最大最小","badge":"function","description":"最大最小の確認問題。","links":[{"label":"チェックPDF","href":"./pdf/minmax_check.pdf"}]},{"title":"数列","badge":"sequence","description":"数列・漸化式のチェック。","links":[{"label":"チェックPDF","href":"./pdf/recurrence_check.pdf"}]},{"title":"対数","badge":"quiz","description":"対数のクイズ教材。","links":[{"label":"クイズPDF","href":"./pdf/log_quiz.pdf"}]},{"title":"微分","badge":"calculus","description":"微分計算のチェック。","links":[{"label":"チェックPDF","href":"./pdf/differentiation_check.pdf"}]},{"title":"接線","badge":"tangent","description":"接線問題と計算練習。","links":[{"label":"チェックPDF","href":"./pdf/tangent_line_check.pdf"},{"label":"計算PDF","href":"./pdf/6tan_calc.pdf"}]}]},{"id":"advanced","label":"Advanced","nav":"発展","items":[{"title":"発展","badge":"advanced","description":"発展問題セット。","links":[{"label":"6tanPDF","href":"./pdf/6tan.pdf"},{"label":"6tan2PDF","href":"./pdf/6tan2.pdf"}]}]}]</script>
<script>
const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  "\"": "&quot;",
  "'": "&#39;"
}[ch]));

const createLink = (link) => {
  const a = document.createElement("a");
  a.href = link.href;
  a.textContent = link.label;
  return a;
};

const renderArchive = (sections) => {
  const nav = document.getElementById("nav");
  const archive = document.getElementById("archive");
  const search = document.getElementById("search");
  const resultCount = document.getElementById("result-count");
  const empty = document.getElementById("empty");
  nav.innerHTML = "";
  archive.innerHTML = "";

  let count = 1;
  let linkCount = 0;
  const entries = [];

  sections.forEach((section) => {
    const navLink = document.createElement("a");
    navLink.href = `#${section.id}`;
    navLink.textContent = section.nav || section.label;
    nav.appendChild(navLink);

    const sectionEl = document.createElement("section");
    sectionEl.className = "section";
    sectionEl.id = section.id;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<h2>${escapeHtml(section.label)}</h2>`;

    const menu = document.createElement("div");
    menu.className = "menu";

    section.items.forEach((item) => {
      linkCount += (item.links || []).length;
      const article = document.createElement("article");
      article.className = "item";
      article.dataset.search = [
        section.label,
        section.nav,
        item.title,
        item.description,
        item.badge,
        ...(item.links || []).map((link) => `${link.label} ${link.href}`)
      ].join(" ").toLowerCase();

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = String(count).padStart(2, "0");
      count += 1;

      const main = document.createElement("div");
      main.className = "main";

      const title = document.createElement("h3");
      title.className = "title";
      title.append(document.createTextNode(item.title || ""));

      if (item.badge) {
        title.append(document.createTextNode(" "));
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = item.badge;
        title.appendChild(badge);
      }

      const desc = document.createElement("p");
      desc.className = "desc";
      desc.textContent = item.description || "";

      main.append(title, desc);

      const links = document.createElement("div");
      links.className = "links";
      (item.links || []).forEach((link) => links.appendChild(createLink(link)));

      article.append(num, main, links);
      menu.appendChild(article);
      entries.push({ article, sectionEl });
    });

    sectionEl.append(head, menu);
    archive.appendChild(sectionEl);
  });

  const itemCount = entries.length;
  document.getElementById("stat-sections").textContent = sections.length;
  document.getElementById("stat-items").textContent = itemCount;
  document.getElementById("stat-links").textContent = linkCount;

  const updateFilter = () => {
    const query = search.value.trim().toLowerCase();
    let visibleCount = 0;

    entries.forEach(({ article }) => {
      const visible = !query || article.dataset.search.includes(query);
      article.hidden = !visible;
      if (visible) visibleCount += 1;
    });

    sections.forEach((section) => {
      const sectionEl = document.getElementById(section.id);
      const hasVisibleItems = [...sectionEl.querySelectorAll(".item")].some((item) => !item.hidden);
      sectionEl.hidden = !hasVisibleItems;
    });

    resultCount.textContent = query
      ? `${visibleCount} / ${itemCount} materials`
      : `${itemCount} materials ready`;
    empty.style.display = visibleCount ? "none" : "block";
  };

  search.addEventListener("input", updateFilter);
  updateFilter();
};

fetch("./materials.json")
  .then((response) => {
    if (!response.ok) throw new Error(`materials.json: ${response.status}`);
    return response.json();
  })
  .then(renderArchive)
  .catch((error) => {
    const fallback = document.getElementById("materials-fallback");
    if (fallback?.textContent) {
      renderArchive(JSON.parse(fallback.textContent));
      console.warn("materials.json could not be fetched; using embedded fallback.", error);
      return;
    }

    document.getElementById("archive").innerHTML =
      `<section class="section"><div class="section-head"><h2>Error</h2></div><p class="desc">materials.json を読み込めませんでした。</p></section>`;
    console.error(error);
  });
</script>
</body>
</html>
