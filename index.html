<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF保管庫 的場</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" type="180x180" href="apple-touch-icon.png">

<style>
:root{
  --bg:#080706;
  --bg-soft:#0f0d0a;
  --panel:#11100d;
  --panel-hover:#17140f;
  --ink:#eee8dc;
  --muted:#a49a8b;
  --faint:#746b5d;
  --line:rgba(214,184,112,.24);
  --line-strong:rgba(214,184,112,.52);
  --gold:#d6b870;
  --gold-soft:rgba(214,184,112,.10);
  --paper:#f1eadc;
  --shadow:0 22px 70px rgba(0,0,0,.42);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 0%, rgba(214,184,112,.075), transparent 28%),
    radial-gradient(circle at 90% 12%, rgba(255,255,255,.035), transparent 24%),
    linear-gradient(180deg, #040403 0%, var(--bg) 38%, #0c0907 100%);
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Times New Roman",
    serif;
  line-height:1.82;
  letter-spacing:.025em;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  width:min(1040px, calc(100% - 34px));
  margin:0 auto;
  padding:54px 0 72px;
}

/* Header */

.header{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:38px;
  align-items:end;
  padding:38px 0 38px;
  border-bottom:1px solid var(--line-strong);
  position:relative;
}

.header::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:54px;
  height:1px;
  background:var(--gold);
}

.kicker{
  margin:0 0 14px;
  color:var(--gold);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  letter-spacing:.22em;
  text-transform:uppercase;
}

h1{
  margin:0;
  font-size:clamp(40px, 7vw, 82px);
  line-height:1.02;
  font-weight:500;
  letter-spacing:.045em;
}

.lead{
  margin:0;
  max-width:440px;
  color:var(--muted);
  font-size:14px;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
  margin-top:22px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.meta span{
  display:inline-flex;
  align-items:center;
  min-height:32px;
  padding:5px 12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:#d8d0c2;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:22px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.nav a{
  display:inline-flex;
  align-items:center;
  min-height:32px;
  padding:5px 11px;
  border:1px solid var(--line);
  color:#dccca4;
  background:var(--gold-soft);
  font-size:12px;
  letter-spacing:.06em;
}

.nav a:hover{
  border-color:var(--line-strong);
  background:rgba(214,184,112,.16);
}

/* Section */

.section{
  padding:34px 0 4px;
}

.section-head{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:12px;
}

.section-head h2{
  margin:0;
  color:var(--gold);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  white-space:nowrap;
}

.section-head::after{
  content:"";
  display:block;
  height:1px;
  flex:1;
  background:linear-gradient(90deg, var(--line-strong), rgba(214,184,112,.04));
}

.menu{
  border-top:1px solid var(--line);
}

/* Item */

.item{
  display:grid;
  grid-template-columns:82px 1fr auto;
  gap:22px;
  align-items:center;
  min-height:94px;
  padding:20px 0;
  border-bottom:1px solid var(--line);
  transition:
    padding .16s ease,
    border-color .16s ease,
    background .16s ease;
}

.item:hover{
  padding-left:12px;
  padding-right:12px;
  border-bottom-color:var(--line-strong);
  background:
    linear-gradient(90deg, rgba(214,184,112,.055), transparent 54%);
}

.num{
  color:rgba(214,184,112,.66);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:12px;
  letter-spacing:.20em;
}

.main{
  min-width:0;
}

.title{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  margin:0;
  font-size:22px;
  line-height:1.35;
  font-weight:500;
  letter-spacing:.04em;
}

.desc{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

.badge{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:2px 8px;
  border:1px solid rgba(214,184,112,.36);
  color:var(--gold);
  background:rgba(214,184,112,.07);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.links{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:8px;
  min-width:260px;
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.links a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:7px 11px;
  border:1px solid rgba(214,184,112,.30);
  background:#0b0a08;
  color:#ead9aa;
  font-size:12px;
  letter-spacing:.04em;
  transition:
    border-color .16s ease,
    background .16s ease,
    color .16s ease;
}

.links a:hover{
  border-color:rgba(214,184,112,.76);
  background:rgba(214,184,112,.13);
  color:#fff2ca;
}

/* Footer */

.footer{
  display:flex;
  justify-content:space-between;
  gap:16px;
  margin-top:44px;
  padding-top:20px;
  border-top:1px solid var(--line-strong);
  color:var(--faint);
  font-family:
    "Helvetica Neue",
    Arial,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

/* Responsive */

@media (max-width:820px){
  .header{
    grid-template-columns:1fr;
    gap:22px;
  }

  .meta{
    justify-content:flex-start;
  }

  .lead{
    max-width:620px;
  }

  .item{
    grid-template-columns:64px 1fr;
    gap:14px;
  }

  .links{
    grid-column:2;
    min-width:0;
    justify-content:flex-start;
  }
}

@media (max-width:540px){
  .wrap{
    width:min(100% - 24px, 1040px);
    padding:34px 0 54px;
  }

  .header{
    padding-top:30px;
  }

  h1{
    font-size:42px;
    letter-spacing:.015em;
  }

  .item{
    grid-template-columns:1fr;
    gap:6px;
    padding:18px 0;
  }

  .links{
    grid-column:auto;
    margin-top:6px;
  }

  .links a{
    width:100%;
  }

  .footer{
    flex-direction:column;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <div>
      <p class="kicker">Matoba Mathematics Archive</p>
      <h1>PDF保管庫<br>的場</h1>

      <nav class="nav" aria-label="ページ内カテゴリ" id="nav"></nav>
    </div>

    <div>
      <p class="lead">
        数学プリント・模試・確認教材を静かに整理しておくための教材目録。
        必要なPDFへ、すばやく、迷わずアクセスできます。
      </p>

      <div class="meta">
        <span>Mathematics</span>
        <span>Handouts</span>
        <span>Archive</span>
      </div>
    </div>
  </header>

  <main id="archive"></main>

  <footer class="footer">
    <span>m4x064.github.io</span>
    <span>Matoba Mathematics Archive</span>
  </footer>

</div>

<script>
const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  "\"": "&quot;",
  "'": "&#39;"
}[ch]));

const createLink = (link) => {
  const a = document.createElement("a");
  a.href = link.href;
  a.textContent = link.label;
  return a;
};

const renderArchive = (sections) => {
  const nav = document.getElementById("nav");
  const archive = document.getElementById("archive");
  nav.innerHTML = "";
  archive.innerHTML = "";

  let count = 1;

  sections.forEach((section) => {
    const navLink = document.createElement("a");
    navLink.href = `#${section.id}`;
    navLink.textContent = section.nav || section.label;
    nav.appendChild(navLink);

    const sectionEl = document.createElement("section");
    sectionEl.className = "section";
    sectionEl.id = section.id;

    const head = document.createElement("div");
    head.className = "section-head";
    head.innerHTML = `<h2>${escapeHtml(section.label)}</h2>`;

    const menu = document.createElement("div");
    menu.className = "menu";

    section.items.forEach((item) => {
      const article = document.createElement("article");
      article.className = "item";

      const num = document.createElement("div");
      num.className = "num";
      num.textContent = String(count).padStart(2, "0");
      count += 1;

      const main = document.createElement("div");
      main.className = "main";

      const title = document.createElement("h3");
      title.className = "title";
      title.append(document.createTextNode(item.title || ""));

      if (item.badge) {
        title.append(document.createTextNode(" "));
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = item.badge;
        title.appendChild(badge);
      }

      const desc = document.createElement("p");
      desc.className = "desc";
      desc.textContent = item.description || "";

      main.append(title, desc);

      const links = document.createElement("div");
      links.className = "links";
      (item.links || []).forEach((link) => links.appendChild(createLink(link)));

      article.append(num, main, links);
      menu.appendChild(article);
    });

    sectionEl.append(head, menu);
    archive.appendChild(sectionEl);
  });
};

fetch("./materials.json")
  .then((response) => {
    if (!response.ok) throw new Error(`materials.json: ${response.status}`);
    return response.json();
  })
  .then(renderArchive)
  .catch((error) => {
    document.getElementById("archive").innerHTML =
      `<section class="section"><div class="section-head"><h2>Error</h2></div><p class="desc">materials.json を読み込めませんでした。</p></section>`;
    console.error(error);
  });
</script>
</body>
</html>
