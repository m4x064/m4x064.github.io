<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFOゆーり Shooting</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hud" aria-label="game status">
        <div>
          <p class="label">UFOゆーり</p>
          <h1>Starlight Shooter</h1>
          <p id="message" class="message">Space / Z で星弾ショット。夜空を守ろう。</p>
        </div>
        <div class="meters">
          <div class="meter">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="meter">
            <span>Hearts</span>
            <strong id="hearts">3</strong>
          </div>
          <div class="meter">
            <span>Wave</span>
            <strong id="wave">1</strong>
          </div>
          <div class="meter">
            <span>Charge</span>
            <strong id="charge">100%</strong>
          </div>
        </div>
      </section>

      <section class="stage-wrap">
        <canvas id="game" width="960" height="540" aria-label="UFOゆーり game"></canvas>
        <button id="start" class="start-button" type="button">Start</button>
      </section>

      <nav class="touch-pad" aria-label="touch controls">
        <button data-dir="left" type="button">←</button>
        <button data-dir="up" type="button">↑</button>
        <button data-dir="down" type="button">↓</button>
        <button data-dir="right" type="button">→</button>
        <button data-action="fire" class="fire" type="button">SHOT</button>
      </nav>
    </main>
    <script src="game.js"></script>
  </body>
</html>
