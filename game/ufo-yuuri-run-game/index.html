<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFOゆーり Run</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hud" aria-label="game status">
        <div>
          <p class="label">UFOゆーり</p>
          <h1>Starlight Run</h1>
        </div>
        <div class="meters">
          <div class="meter">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="meter">
            <span>Hearts</span>
            <strong id="hearts">3</strong>
          </div>
        </div>
      </section>

      <section class="stage-wrap">
        <canvas id="game" width="960" height="540" aria-label="UFOゆーり run game"></canvas>
        <button id="start" class="start-button" type="button">Start</button>
      </section>

      <nav class="touch-pad" aria-label="touch controls">
        <button data-dir="left" type="button">←</button>
        <button data-dir="up" type="button">↑</button>
        <button data-dir="down" type="button">↓</button>
        <button data-dir="right" type="button">→</button>
      </nav>
    </main>
    <script src="game.js"></script>
  </body>
</html>
