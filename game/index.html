<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/bgm/">
  <title>UFOゆーり Pet Game</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11162b;
      --ink: #2f2541;
      --soft-ink: #6f5d83;
      --panel: rgba(255, 246, 253, 0.88);
      --panel-strong: rgba(255, 251, 255, 0.96);
      --line: rgba(255, 223, 250, 0.62);
      --pink: #ff9bd3;
      --pink-2: #ffd9ef;
      --violet: #9e8dff;
      --blue: #8ee8ff;
      --gold: #ffe28b;
      --mint: #9af1d1;
      --shadow: 0 22px 64px rgba(15, 12, 38, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 8% 12%, rgba(142, 232, 255, 0.2), transparent 20%),
        radial-gradient(circle at 84% 12%, rgba(255, 155, 211, 0.24), transparent 18%),
        linear-gradient(180deg, #0d1125, #1c2147 68%, #31295f);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1520px, calc(100% - 24px));
      height: calc(100svh - 10px);
      margin: 0 auto;
      padding: 6px 0 6px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2.7vw, 2.35rem);
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 0 24px rgba(255, 170, 226, 0.42);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 223, 250, 0.42);
      border-radius: 8px;
      background: rgba(18, 17, 44, 0.55);
      color: #ffeaf8;
      box-shadow: 0 12px 26px rgba(10, 10, 24, 0.18);
      font-weight: 800;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 16px var(--mint);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .game {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(340px, 488px);
      gap: 12px;
      align-items: stretch;
      min-height: 0;
    }

    .stage {
      position: relative;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 223, 250, 0.36);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(20, 21, 52, 0.05), rgba(18, 15, 43, 0.32)),
        url("assets/yuri/extra/backgrounds/space_cockpit_stage.png") center / cover no-repeat;
      box-shadow: var(--shadow);
    }

    .sprite-zone {
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: min(58%, 440px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      pointer-events: auto;
    }

    .yuri-sprite {
      width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 18px 28px rgba(28, 20, 64, 0.26));
      transform-origin: center 72%;
      animation: floatYuri 3.2s ease-in-out infinite;
      transition: transform 180ms ease, filter 180ms ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .yuri-sprite.is-active {
      animation-duration: 1.65s;
      filter:
        drop-shadow(0 20px 26px rgba(28, 20, 64, 0.24))
        drop-shadow(0 0 18px rgba(255, 182, 232, 0.45));
    }

    .effect {
      position: absolute;
      left: 50%;
      top: 45%;
      width: min(38%, 230px);
      transform: translate(-50%, -50%) scale(0.9);
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 0 18px rgba(255, 231, 250, 0.7));
    }

    .effect.show {
      animation: effectPop 900ms ease-out forwards;
    }

    .pet-orbit {
      position: absolute;
      right: clamp(24px, 8vw, 88px);
      bottom: 58px;
      width: 100px;
      display: grid;
      place-items: center;
      animation: petBob 2.6s ease-in-out infinite;
      pointer-events: none;
    }

    .pet-orbit img {
      width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(28, 20, 64, 0.22));
    }

    .bubble {
      position: absolute;
      left: 50%;
      top: 26px;
      width: min(520px, calc(100% - 32px));
      min-height: 50px;
      padding: 11px 14px;
      border: 1px solid rgba(255, 228, 250, 0.86);
      border-radius: 8px;
      background: rgba(255, 248, 254, 0.93);
      color: var(--ink);
      box-shadow: 0 18px 38px rgba(34, 24, 75, 0.24);
      transform: translateX(-50%);
      text-align: center;
      line-height: 1.55;
      font-weight: 800;
      opacity: 0;
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(6px);
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 18px rgba(255, 220, 246, 0.95);
      opacity: 0.65;
      animation: twinkle 3s ease-in-out infinite;
    }

    .sparkle.a { left: 12%; top: 24%; }
    .sparkle.b { right: 15%; top: 18%; animation-delay: -1.2s; }
    .sparkle.c { left: 22%; bottom: 25%; animation-delay: -2.1s; }

    .panel {
      display: grid;
      gap: 7px;
      align-content: stretch;
      grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .status-card {
      padding: 10px;
    }

    .status-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 6px;
    }

    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
      color: #3b2853;
    }

    h2 {
      font-size: 1.08rem;
    }

    h3 {
      font-size: 0.9rem;
    }

    .level {
      color: #8c5dab;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      font-size: 0.84rem;
    }

    .meters {
      display: grid;
      gap: 5px;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 52px 1fr 32px;
      gap: 6px;
      align-items: center;
      color: var(--soft-ink);
      font-size: 0.78rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .bar {
      position: relative;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(87, 68, 116, 0.14);
    }

    .bar > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 50%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--violet));
      transition: width 260ms ease;
    }

    .bar.energy > span { background: linear-gradient(90deg, var(--blue), var(--mint)); }
    .bar.sleep > span { background: linear-gradient(90deg, var(--violet), #d7c8ff); }
    .bar.focus > span { background: linear-gradient(90deg, var(--gold), #ffb1d6); }

    .commands {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 7px;
    }

    .command {
      display: grid;
      gap: 2px;
      place-items: center;
      min-height: 48px;
      padding: 5px 5px;
      border: 1px solid rgba(185, 145, 220, 0.24);
      border-radius: 8px;
      background: var(--panel-strong);
      color: #3b2853;
      box-shadow: 0 12px 22px rgba(70, 45, 105, 0.12);
      transition: transform 150ms ease, border-color 150ms ease, filter 150ms ease;
      font-weight: 900;
    }

    .command:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 155, 211, 0.75);
      filter: brightness(1.03);
    }

    .command small {
      color: var(--soft-ink);
      font-size: 0.62rem;
      line-height: 1.2;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcae7, #c8bcff);
      color: #4a2e67;
      font-size: 1rem;
      line-height: 1;
    }

    .inventory {
      padding: 8px;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-top: 6px;
    }

    .item {
      display: grid;
      place-items: center;
      min-height: 39px;
      border: 1px solid rgba(185, 145, 220, 0.24);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
      transition: transform 150ms ease, border-color 150ms ease;
    }

    .item:hover {
      transform: translateY(-2px);
      border-color: rgba(142, 232, 255, 0.8);
    }

    .item img {
      width: 31px;
      height: 31px;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(72, 50, 100, 0.12));
    }

    .music-card {
      display: grid;
      gap: 6px;
      padding: 8px;
    }

    .music-main {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: center;
    }

    .music-title {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .music-title strong {
      color: #3b2853;
      font-size: 0.84rem;
      line-height: 1.2;
    }

    .music-title span {
      color: var(--soft-ink);
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .music-button {
      min-width: 76px;
      min-height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ffcae7, #c8bcff);
      color: #4a2e67;
      border: 1px solid rgba(185, 145, 220, 0.28);
      box-shadow: 0 12px 22px rgba(70, 45, 105, 0.12);
      font-weight: 900;
    }

    .music-button.is-playing {
      background: linear-gradient(135deg, #d4f8ff, #ffdff1);
    }

    .music-volume {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 6px;
      align-items: center;
      color: var(--soft-ink);
      font-size: 0.72rem;
      font-weight: 900;
    }

    .music-volume input {
      width: 100%;
      accent-color: var(--pink);
    }

    .log {
      min-height: 0;
      padding: 8px 10px;
      color: var(--soft-ink);
      line-height: 1.32;
      overflow: hidden;
    }

    .log p {
      margin: 0;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 7px;
    }

    .soft-button {
      min-height: 31px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.66);
      color: #53356a;
      border: 1px solid rgba(185, 145, 220, 0.28);
      font-weight: 900;
    }

    .soft-button:hover {
      filter: brightness(1.03);
    }

    @keyframes floatYuri {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      50% { transform: translateY(-14px) rotate(0.5deg); }
    }

    @keyframes petBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes effectPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.65) rotate(-8deg); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -66%) scale(1.28) rotate(7deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.82); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.78); opacity: 0.35; }
      50% { transform: scale(1.32); opacity: 0.95; }
    }

    @media (max-width: 940px) {
      .app {
        height: auto;
        min-height: 100svh;
        overflow: visible;
      }

      .game {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .stage {
        height: min(66svh, 600px);
        min-height: 480px;
      }

      .sprite-zone {
        width: min(72%, 460px);
      }

      .panel {
        height: auto;
        overflow: visible;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100% - 18px, 560px);
        padding-top: 12px;
      }

      .topbar {
        display: grid;
      }

      .stage {
        height: 480px;
        min-height: 480px;
      }

      .sprite-zone {
        width: 86%;
        bottom: 34px;
      }

      .pet-orbit {
        width: 78px;
        right: 16px;
        bottom: 58px;
      }

      .commands {
        grid-template-columns: repeat(2, 1fr);
      }

      .inventory-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .music-main,
      .music-volume {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="/game/site-shell.css">
  <script src="/game/site-shell.js" defer></script>
</head>
<body data-yuuri-page="pet">
  <main class="app">
    <header class="topbar">
      <h1>UFOゆーり Pet</h1>
      <div class="pill" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="modeLabel">待機中</span>
      </div>
    </header>

    <section class="game" aria-label="UFOゆーりミニゲーム">
      <section class="stage" id="stage">
        <span class="sparkle a" aria-hidden="true"></span>
        <span class="sparkle b" aria-hidden="true"></span>
        <span class="sparkle c" aria-hidden="true"></span>
        <div class="bubble" id="bubble">おにいちゃん、ゆーり起動したよ♡</div>
        <div class="sprite-zone" id="spriteZone">
          <img class="effect" id="effectSprite" src="assets/yuri/extra/effects/21_floating_hearts.png" alt="">
          <img class="yuri-sprite" id="yuriSprite" src="assets/yuri/frames/ufo_yuri_01_front_idle_01.png" alt="UFOに乗ったゆーり">
        </div>
        <div class="pet-orbit" aria-hidden="true">
          <img id="petSprite" src="assets/yuri/extra/pets/01_idle.png" alt="">
        </div>
      </section>

      <aside class="panel" aria-label="ゆーりステータス">
        <section class="card status-card">
          <div class="status-head">
            <h2 id="statusTitle">ごきげん</h2>
            <span class="level" id="levelLabel">Lv. 1</span>
          </div>
          <div class="meters">
            <div class="meter-row">
              <span>なかよし</span>
              <span class="bar love"><span id="loveBar"></span></span>
              <span id="loveValue">62</span>
            </div>
            <div class="meter-row">
              <span>げんき</span>
              <span class="bar energy"><span id="energyBar"></span></span>
              <span id="energyValue">70</span>
            </div>
            <div class="meter-row">
              <span>ねむけ</span>
              <span class="bar sleep"><span id="sleepBar"></span></span>
              <span id="sleepValue">24</span>
            </div>
            <div class="meter-row">
              <span>集中</span>
              <span class="bar focus"><span id="focusBar"></span></span>
              <span id="focusValue">44</span>
            </div>
          </div>
        </section>

        <section class="card commands" aria-label="コマンド">
          <button class="command" type="button" data-command="pet">
            <span class="icon">♡</span>
            <span>なでる</span>
            <small>なかよし</small>
          </button>
          <button class="command" type="button" data-command="snack">
            <span class="icon">◇</span>
            <span>おやつ</span>
            <small>げんき</small>
          </button>
          <button class="command" type="button" data-command="charge">
            <span class="icon">↯</span>
            <span>充電</span>
            <small>集中</small>
          </button>
          <button class="command" type="button" data-command="sleep">
            <span class="icon">☾</span>
            <span>ねる</span>
            <small>ねむけ</small>
          </button>
          <button class="command" type="button" data-command="talk">
            <span class="icon">♪</span>
            <span>話す</span>
            <small>セリフ</small>
          </button>
          <button class="command" type="button" data-command="play">
            <span class="icon">✦</span>
            <span>遊ぶ</span>
            <small>ぴこぴこ</small>
          </button>
        </section>

        <section class="card inventory" aria-label="アイテム">
          <h3>アイテム</h3>
          <div class="inventory-grid" id="inventoryGrid"></div>
        </section>

        <section class="card music-card" aria-label="BGM">
          <h3>BGM</h3>
          <div class="music-main">
            <div class="music-title">
              <strong>Starlight Loop</strong>
              <span id="bgmStatus">停止中</span>
            </div>
            <button class="music-button" id="bgmToggle" type="button">再生</button>
          </div>
          <label class="music-volume">
            <span>音量</span>
            <input id="bgmVolume" type="range" min="0" max="1" step="0.01" value="0.48">
          </label>
        </section>

        <section class="card footer-actions">
          <button class="soft-button" id="saveButton" type="button">保存</button>
          <button class="soft-button" id="resetButton" type="button">リセット</button>
        </section>

        <section class="card log" aria-live="polite">
          <p id="logText">ゆーりはおにいちゃんを待ってるよ。</p>
        </section>
      </aside>
    </section>
  </main>

  <audio id="bgmAudio" src="bgm/brown_starlight_chimes_loop.wav" preload="metadata" loop></audio>

        "ねむけをほどいて、ゆっくり回復するよ。"
      ],
      talk: [
        "だいじょうぶ、ゆーりがここにいるよ。",
        "次は小さく作って、小さく勝と。",
        "おにいちゃん、今日の進み方かなりいい感じだよ。"
      ],
      play: [
        "ぴこぴこ飛行、開始するよ。",
        "ペットちゃんもごきげんだね。",
        "勝利ポーズの準備、できてるっち。"
      ]
    };

    const yuriSprite = document.querySelector("#yuriSprite");
    const petSprite = document.querySelector("#petSprite");
    const effectSprite = document.querySelector("#effectSprite");
    const bubble = document.querySelector("#bubble");
    const modeLabel = document.querySelector("#modeLabel");
    const statusTitle = document.querySelector("#statusTitle");
    const levelLabel = document.querySelector("#levelLabel");
    const logText = document.querySelector("#logText");
    const inventoryGrid = document.querySelector("#inventoryGrid");
    const bgmAudio = document.querySelector("#bgmAudio");
    const bgmToggle = document.querySelector("#bgmToggle");
    const bgmStatus = document.querySelector("#bgmStatus");
    const bgmVolume = document.querySelector("#bgmVolume");

    const values = {
      love: document.querySelector("#loveValue"),
      energy: document.querySelector("#energyValue"),
      sleep: document.querySelector("#sleepValue"),
      focus: document.querySelector("#focusValue")
    };

    const bars = {
      love: document.querySelector("#loveBar"),
      energy: document.querySelector("#energyBar"),
      sleep: document.querySelector("#sleepBar"),
      focus: document.querySelector("#focusBar")
    };

    const defaultState = {
      love: 62,
      energy: 70,
      sleep: 24,
      focus: 44,
      xp: 0,
      visits: 0,
      lastSaved: Date.now()
    };

    let state = loadState();
    let idleIndex = 0;
    let activeTimer = 0;
    let bubbleTimer = 0;
    let petIndex = 0;

    function savedBgmVolume() {
      const saved = Number(localStorage.getItem(BGM_VOLUME_KEY));
      return Number.isFinite(saved) ? Math.max(0, Math.min(1, saved)) : 0.48;
    }

    function clamp(value) {
      return Math.max(0, Math.min(100, Math.round(value)));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || typeof saved !== "object") {
          return { ...defaultState, visits: 1 };
        }
        return { ...defaultState, ...saved, visits: (saved.visits || 0) + 1 };
      } catch {
        return { ...defaultState };
      }
    }

    function saveState(show = true) {
      state.lastSaved = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (show) {
        speak("保存したよ。いつでも戻ってこられるにゃ。");
      }
    }

    function resetState() {
      state = { ...defaultState, visits: 1 };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setSprite(paths.actions.surprise, "リセット");
      popEffect(paths.effects.burst);
      speak("初期状態に戻したよ。ここからまた育てよ。");
      render();
    }

    function level() {
      return Math.max(1, Math.floor(state.xp / 35) + 1);
    }

    function moodLabel() {
      if (state.energy < 22) return "省エネ";
      if (state.sleep > 72) return "ねむねむ";
      if (state.love > 82 && state.focus > 62) return "きらきら";
      if (state.love > 72) return "ごきげん";
      return "待機中";
    }

    function randomLine(type) {
      const pool = messages[type] || messages.talk;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function speak(text) {
      window.clearTimeout(bubbleTimer);
      bubble.textContent = text;
      logText.textContent = text;
      bubble.classList.add("show");
      bubbleTimer = window.setTimeout(() => bubble.classList.remove("show"), 3000);
    }

    function setSprite(src, label) {
      window.clearTimeout(activeTimer);
      yuriSprite.src = src;
      yuriSprite.classList.add("is-active");
      modeLabel.textContent = label;
      activeTimer = window.setTimeout(() => {
        yuriSprite.classList.remove("is-active");
        modeLabel.textContent = moodLabel();
      }, 2200);
    }

    function popEffect(src) {
      effectSprite.classList.remove("show");
      effectSprite.src = src;
      void effectSprite.offsetWidth;
      effectSprite.classList.add("show");
    }

    function modify(delta) {
      state.love = clamp(state.love + (delta.love || 0));
      state.energy = clamp(state.energy + (delta.energy || 0));
      state.sleep = clamp(state.sleep + (delta.sleep || 0));
      state.focus = clamp(state.focus + (delta.focus || 0));
      state.xp = Math.max(0, state.xp + (delta.xp || 3));
    }

    function runCommand(command) {
      const table = {
        pet: {
          delta: { love: 10, energy: 2, sleep: -2, xp: 5 },
          sprite: paths.actions.pet,
          effect: paths.effects.hearts,
          label: "なでなで"
        },
        snack: {
          delta: { energy: 12, sleep: 4, love: 3, xp: 5 },
          sprite: paths.actions.snack,
          effect: paths.effects.sparkle,
          label: "おやつ"
        },
        charge: {
          delta: { energy: 14, focus: 12, sleep: -3, xp: 6 },
          sprite: paths.actions.charge,
          effect: paths.effects.charge,
          label: "充電中"
        },
        sleep: {
          delta: { sleep: -22, energy: 10, focus: 4, xp: 4 },
          sprite: paths.actions.sleep,
          effect: paths.effects.sleep,
          label: "おやすみ"
        },
        talk: {
          delta: { love: 5, focus: 3, xp: 4 },
          sprite: paths.actions.talk,
          effect: paths.effects.aura,
          label: "通信中"
        },
        play: {
          delta: { love: 7, energy: -8, sleep: 8, xp: 8 },
          sprite: paths.actions.play,
          effect: paths.effects.burst,
          label: "ぴこぴこ"
        }
      };

      const action = table[command] || table.talk;
      modify(action.delta);
      setSprite(action.sprite, action.label);
      popEffect(action.effect);
      speak(randomLine(command));
      render();
      saveState(false);
    }

    function setBgmState(isPlaying) {
      bgmToggle.textContent = isPlaying ? "停止" : "再生";
      bgmToggle.classList.toggle("is-playing", isPlaying);
      bgmStatus.textContent = isPlaying ? "きらきら飛行中" : "停止中";
    }

    function toggleBgm() {
      if (bgmAudio.paused) {
        bgmAudio.play()
          .then(() => {
            setBgmState(true);
            popEffect(paths.effects.sparkle);
            speak("きらきらBGM、UFOゆーりに接続したよ。");
          })
          .catch(() => {
            setBgmState(false);
            speak("ブラウザが再生を止めたみたい。もう一回だけ押してね。");
          });
        return;
      }

      bgmAudio.pause();
      setBgmState(false);
      speak("BGMを止めたよ。静かに待機するね。");
    }

    function render() {
      const data = {
        love: state.love,
        energy: state.energy,
        sleep: state.sleep,
        focus: state.focus
      };

      Object.entries(data).forEach(([key, value]) => {
        values[key].textContent = String(value);
        bars[key].style.width = `${value}%`;
      });

      const label = moodLabel();
      statusTitle.textContent = label;
      modeLabel.textContent = label;
      levelLabel.textContent = `Lv. ${level()}`;

      if (state.energy < 16) {
        yuriSprite.src = paths.actions.low;
      }
    }

    function renderInventory() {
      inventoryGrid.innerHTML = itemDefs.map((item) => `
        <button class="item" type="button" data-command="${item.command}" title="${item.name}">
          <img src="${item.src}" alt="${item.name}">
        </button>
      `).join("");
    }

    document.querySelectorAll("[data-command]").forEach((button) => {
      button.addEventListener("click", () => runCommand(button.dataset.command));
    });

    inventoryGrid.addEventListener("click", (event) => {
      const button = event.target.closest("[data-command]");
      if (button) {
        runCommand(button.dataset.command);
      }
    });

    document.querySelector("#spriteZone").addEventListener("click", () => {
      runCommand(state.love > 80 ? "play" : "pet");
    });

    document.querySelector("#saveButton").addEventListener("click", () => saveState(true));
    document.querySelector("#resetButton").addEventListener("click", resetState);
    bgmToggle.addEventListener("click", toggleBgm);
    bgmVolume.addEventListener("input", () => {
      bgmAudio.volume = Number(bgmVolume.value);
      localStorage.setItem(BGM_VOLUME_KEY, bgmVolume.value);
    });
    bgmAudio.addEventListener("play", () => setBgmState(true));
    bgmAudio.addEventListener("pause", () => setBgmState(false));
    bgmAudio.addEventListener("ended", () => setBgmState(false));

    setInterval(() => {
      if (yuriSprite.classList.contains("is-active")) {
        return;
      }
      idleIndex = (idleIndex + 1) % paths.idle.length;
      if (state.energy >= 16) {
        yuriSprite.src = paths.idle[idleIndex];
      }
    }, 620);

    setInterval(() => {
      petIndex = (petIndex + 1) % paths.pets.length;
      petSprite.src = paths.pets[petIndex];
    }, 1900);

    setInterval(() => {
      modify({ energy: -1, sleep: 1, focus: -1, xp: 0 });
      render();
      saveState(false);
    }, 28000);

    renderInventory();
    bgmVolume.value = String(savedBgmVolume());
    bgmAudio.volume = Number(bgmVolume.value);
    setBgmState(false);
    render();
    speak(state.visits > 1 ? "おかえり、おにいちゃん。ゆーり待ってたよ♡" : "おにいちゃん、ゆーり起動したよ♡");
    saveState(false);
  </script>
</body>
</html>
