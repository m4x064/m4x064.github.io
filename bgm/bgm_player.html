<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UFOゆーり BGM Player</title>
  <style>
    :root {
      color-scheme: dark;
      --space: #101326;
      --space-2: #20244a;
      --panel: rgba(255, 240, 252, 0.86);
      --panel-2: rgba(244, 220, 255, 0.72);
      --ink: #33233f;
      --muted: #7f6b92;
      --line: rgba(255, 220, 248, 0.58);
      --pink: #ff9cd2;
      --pink-2: #ffd4ef;
      --lavender: #bda9ff;
      --mint: #a9fff2;
      --shadow: 0 24px 70px rgba(14, 12, 38, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 78% 16%, rgba(255, 190, 231, 0.28), transparent 12%),
        radial-gradient(circle at 18% 24%, rgba(163, 161, 255, 0.24), transparent 14%),
        linear-gradient(180deg, #0c1022 0%, var(--space) 42%, var(--space-2) 100%);
    }

    body::before,
    body::after {
      position: fixed;
      inset: 0;
      z-index: -2;
      content: "";
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.96) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255, 207, 241, 0.9) 0 1.2px, transparent 2px);
      background-position: 0 0, 38px 54px;
      background-size: 96px 96px, 142px 142px;
      animation: driftStars 28s linear infinite;
      opacity: 0.8;
    }

    body::after {
      z-index: -1;
      background-size: 180px 180px, 220px 220px;
      filter: blur(0.2px);
      opacity: 0.48;
      animation-duration: 44s;
      animation-direction: reverse;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      min-height: 58px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3.4rem);
      line-height: 1;
      letter-spacing: 0;
      text-shadow: 0 0 26px rgba(255, 180, 231, 0.44);
    }

    .signal {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 190px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 221, 248, 0.46);
      border-radius: 8px;
      background: rgba(20, 17, 44, 0.58);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.16);
      color: #ffe9f8;
      font-size: 0.92rem;
      justify-content: flex-end;
    }

    .signal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 18px var(--pink);
      animation: pulseDot 1.9s ease-in-out infinite;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(390px, 1.05fr) minmax(330px, 0.95fr);
      gap: 22px;
      align-items: stretch;
    }

    .stage {
      position: relative;
      min-height: 680px;
      overflow: hidden;
      border: 1px solid rgba(255, 220, 248, 0.34);
      border-radius: 8px;
      background:
        radial-gradient(circle at 48% 82%, rgba(255, 178, 233, 0.34), transparent 30%),
        linear-gradient(180deg, rgba(35, 34, 78, 0.36), rgba(14, 16, 38, 0.72));
      box-shadow: var(--shadow);
    }

    .moon,
    .planet {
      position: absolute;
      border-radius: 50%;
      opacity: 0.9;
    }

    .moon {
      top: 72px;
      right: 76px;
      width: 68px;
      height: 68px;
      background: #ffd8f1;
      box-shadow: 0 0 28px rgba(255, 207, 241, 0.52);
    }

    .moon::after {
      position: absolute;
      top: -8px;
      left: -18px;
      width: 64px;
      height: 74px;
      border-radius: 50%;
      background: #151830;
      content: "";
    }

    .planet {
      top: 112px;
      left: 62px;
      width: 82px;
      height: 82px;
      background:
        radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.32), transparent 18%),
        linear-gradient(135deg, rgba(168, 155, 232, 0.88), rgba(82, 82, 138, 0.78));
      box-shadow: inset -18px -14px 24px rgba(35, 29, 68, 0.38);
    }

    .planet::after {
      position: absolute;
      top: 34px;
      left: -28px;
      width: 138px;
      height: 18px;
      border: 5px solid rgba(188, 180, 236, 0.44);
      border-top-color: transparent;
      border-radius: 50%;
      transform: rotate(-12deg);
      content: "";
    }

    .spark {
      position: absolute;
      width: 14px;
      height: 14px;
      color: #ffe8f8;
      filter: drop-shadow(0 0 12px rgba(255, 210, 244, 0.82));
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .spark::before,
    .spark::after {
      position: absolute;
      inset: 0;
      margin: auto;
      background: currentColor;
      border-radius: 999px;
      content: "";
    }

    .spark::before {
      width: 3px;
      height: 100%;
    }

    .spark::after {
      width: 100%;
      height: 3px;
    }

    .spark.one { top: 84px; left: 34%; animation-delay: -0.4s; }
    .spark.two { top: 210px; right: 12%; width: 20px; height: 20px; animation-delay: -1.4s; }
    .spark.three { bottom: 184px; left: 18%; width: 18px; height: 18px; animation-delay: -2.1s; }

    .ufo-wrap {
      position: absolute;
      left: 50%;
      bottom: 48px;
      width: min(86%, 760px);
      aspect-ratio: 1.42;
      transform: translateX(-50%);
      animation: floatUfo 5.4s ease-in-out infinite;
    }

    .ufo-wrap.image-mode {
      bottom: 102px;
      display: grid;
      place-items: center;
      width: min(62%, 340px);
      aspect-ratio: 1;
      z-index: 8;
      pointer-events: none;
    }

    .beam {
      position: absolute;
      left: 50%;
      bottom: -150px;
      width: 52%;
      height: 330px;
      transform: translateX(-50%);
      clip-path: polygon(32% 0, 68% 0, 100% 100%, 0 100%);
      background: linear-gradient(180deg, rgba(255, 207, 245, 0.52), rgba(255, 207, 245, 0.08));
      filter: blur(0.3px);
      opacity: 0.78;
      animation: beamGlow 2.8s ease-in-out infinite;
    }

    .image-mode .beam {
      bottom: -154px;
      width: 42%;
      height: 260px;
      z-index: 0;
    }

    .yuri-fleet {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      perspective: 900px;
    }

    .mini-yuri {
      position: absolute;
      width: clamp(64px, 12vw, 118px);
      height: auto;
      object-fit: contain;
      opacity: 0.82;
      filter:
        drop-shadow(0 14px 18px rgba(20, 12, 44, 0.28))
        drop-shadow(0 0 16px rgba(255, 176, 226, 0.2));
      transform-origin: 50% 62%;
      animation: miniFloat 5.8s ease-in-out infinite;
      user-select: none;
    }

    .mini-yuri.back {
      width: clamp(42px, 8vw, 76px);
      z-index: 1;
      opacity: 0.46;
      filter:
        drop-shadow(0 8px 12px rgba(20, 12, 44, 0.2))
        drop-shadow(0 0 12px rgba(255, 176, 226, 0.16));
    }

    .mini-yuri.mid {
      width: clamp(58px, 11vw, 104px);
      z-index: 2;
      opacity: 0.68;
    }

    .mini-yuri.front {
      width: clamp(82px, 15vw, 138px);
      z-index: 3;
      opacity: 0.9;
    }

    .mini-yuri.one {
      left: 5%;
      top: 20%;
      transform: rotate(-8deg);
      animation-delay: -0.6s;
    }

    .mini-yuri.two {
      right: 6%;
      top: 17%;
      transform: rotate(8deg);
      animation-delay: -2.4s;
    }

    .mini-yuri.three {
      left: 10%;
      bottom: 18%;
      transform: rotate(5deg);
      animation-delay: -3.1s;
    }

    .mini-yuri.four {
      right: 11%;
      bottom: 20%;
      transform: rotate(-5deg);
      animation-delay: -4.3s;
    }

    .mini-yuri.five {
      left: 23%;
      top: 11%;
      transform: rotate(4deg);
      animation-delay: -1.3s;
      animation-duration: 6.4s;
    }

    .mini-yuri.six {
      right: 25%;
      top: 9%;
      transform: rotate(-4deg);
      animation-delay: -3.7s;
      animation-duration: 6.9s;
    }

    .mini-yuri.seven {
      left: 28%;
      bottom: 10%;
      transform: rotate(-8deg);
      animation-delay: -5.1s;
      animation-duration: 7.2s;
    }

    .mini-yuri.eight {
      right: 27%;
      bottom: 11%;
      transform: rotate(8deg);
      animation-delay: -2.8s;
      animation-duration: 7.5s;
    }

    .mini-yuri.nine {
      left: 42%;
      top: 20%;
      transform: rotate(-2deg);
      animation-delay: -4.8s;
      animation-duration: 8s;
    }

    .mini-yuri.ten {
      right: 41%;
      top: 31%;
      transform: rotate(2deg);
      animation-delay: -1.8s;
      animation-duration: 8.4s;
    }

    .mini-yuri.eleven {
      left: 2%;
      top: 48%;
      transform: rotate(10deg);
      animation-delay: -6.2s;
      animation-duration: 7.8s;
    }

    .mini-yuri.twelve {
      right: 2%;
      top: 47%;
      transform: rotate(-10deg);
      animation-delay: -0.9s;
      animation-duration: 7.8s;
    }

    .frame-glow {
      position: absolute;
      inset: 19% 12% 14%;
      z-index: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 207, 245, 0.42), transparent 52%),
        radial-gradient(circle at 50% 60%, rgba(171, 151, 255, 0.22), transparent 60%);
      filter: blur(18px);
      opacity: 0.82;
    }

    .yuri-frame {
      position: relative;
      z-index: 2;
      width: min(100%, 300px);
      max-height: 100%;
      object-fit: contain;
      transform-origin: 50% 62%;
      filter:
        drop-shadow(0 28px 32px rgba(20, 12, 44, 0.38))
        drop-shadow(0 0 28px rgba(255, 176, 226, 0.36));
      transition: opacity 120ms ease, transform 180ms ease, filter 220ms ease;
      user-select: none;
    }

    .yuri-frame.frame-swap {
      opacity: 0.72;
      transform: scale(0.985);
    }

    .dome {
      position: absolute;
      left: 15%;
      top: 2%;
      width: 70%;
      height: 58%;
      border: 5px solid rgba(255, 231, 250, 0.84);
      border-bottom: 0;
      border-radius: 50% 50% 12% 12% / 92% 92% 10% 10%;
      background:
        radial-gradient(circle at 34% 24%, rgba(255, 255, 255, 0.58), transparent 10%),
        linear-gradient(145deg, rgba(255, 231, 250, 0.52), rgba(186, 169, 255, 0.22) 44%, rgba(255, 255, 255, 0.1));
      box-shadow:
        inset 0 0 38px rgba(255, 255, 255, 0.24),
        0 0 26px rgba(255, 210, 246, 0.48);
      overflow: hidden;
      z-index: 4;
    }

    .dome::before {
      position: absolute;
      top: 12%;
      left: 11%;
      width: 22%;
      height: 7%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      transform: rotate(-30deg);
      content: "";
    }

    .yuri {
      position: absolute;
      left: 50%;
      bottom: 32%;
      z-index: 5;
      width: 260px;
      height: 250px;
      transform: translateX(-50%);
      animation: peek 4.8s ease-in-out infinite;
    }

    .hair-back {
      position: absolute;
      left: 22px;
      top: 42px;
      width: 216px;
      height: 158px;
      border-radius: 48% 48% 42% 42%;
      background:
        radial-gradient(circle at 28% 24%, rgba(255, 255, 255, 0.42), transparent 12%),
        linear-gradient(160deg, #f9c8f6, #d6b3ff 70%);
      box-shadow: inset 0 -18px 28px rgba(171, 126, 216, 0.22);
    }

    .face {
      position: absolute;
      left: 50%;
      top: 78px;
      width: 152px;
      height: 112px;
      border-radius: 46% 46% 42% 42%;
      background: linear-gradient(180deg, #fff3fb, #ffdff0);
      transform: translateX(-50%);
      box-shadow: 0 8px 22px rgba(105, 66, 124, 0.18);
    }

    .bangs {
      position: absolute;
      left: 48px;
      top: 48px;
      width: 164px;
      height: 70px;
      border-radius: 50% 50% 28% 28%;
      background:
        repeating-linear-gradient(90deg, transparent 0 19px, rgba(168, 113, 206, 0.22) 20px 22px),
        linear-gradient(180deg, #ffd7fb, #e8b7ff);
      clip-path: polygon(0 0, 100% 0, 93% 62%, 76% 42%, 65% 78%, 51% 48%, 40% 82%, 28% 46%, 15% 72%, 7% 42%);
      z-index: 2;
    }

    .eye {
      position: absolute;
      top: 55px;
      width: 30px;
      height: 34px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 28%, white 0 4px, transparent 5px),
        radial-gradient(circle at 54% 58%, #a888f2 0 5px, transparent 6px),
        linear-gradient(180deg, #4e3b82, #9270d7);
      animation: blink 5.6s ease-in-out infinite;
    }

    .eye.left { left: 34px; }
    .eye.right { right: 34px; }

    .cheek {
      position: absolute;
      top: 80px;
      width: 24px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 140, 196, 0.36);
      filter: blur(1px);
    }

    .cheek.left { left: 22px; }
    .cheek.right { right: 22px; }

    .mouth {
      position: absolute;
      left: 50%;
      top: 86px;
      width: 18px;
      height: 10px;
      border-bottom: 3px solid #9d6b91;
      border-radius: 0 0 999px 999px;
      transform: translateX(-50%);
    }

    .hand {
      position: absolute;
      top: 174px;
      width: 44px;
      height: 30px;
      border-radius: 999px 999px 18px 18px;
      background: #ffe9f5;
      z-index: 7;
      animation: handTap 2.6s ease-in-out infinite;
    }

    .hand.left { left: 58px; animation-delay: -0.8s; }
    .hand.right { right: 58px; }

    .antenna {
      position: absolute;
      top: 20px;
      width: 56px;
      height: 70px;
      border-left: 5px solid #ffe7fb;
      transform-origin: bottom;
      z-index: 1;
    }

    .antenna.left {
      left: 68px;
      transform: rotate(-16deg);
    }

    .antenna.right {
      right: 62px;
      transform: rotate(16deg);
    }

    .antenna::after {
      position: absolute;
      top: -10px;
      left: -14px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 34% 26%, white, #f6c9f4 46%, #c6a8ff);
      content: "";
      box-shadow: 0 0 18px rgba(255, 221, 250, 0.72);
    }

    .head-badge {
      position: absolute;
      left: 50%;
      top: 38px;
      z-index: 4;
      width: 96px;
      height: 72px;
      transform: translateX(-50%);
      color: #ff9cd2;
      font-weight: 900;
      text-align: center;
      line-height: 64px;
      font-size: 0.82rem;
      filter: drop-shadow(0 8px 10px rgba(107, 74, 128, 0.18));
    }

    .head-badge::before,
    .head-badge::after {
      position: absolute;
      top: 16px;
      width: 48px;
      height: 48px;
      border-radius: 50% 50% 0 50%;
      background: #fff2fb;
      content: "";
      z-index: -1;
    }

    .head-badge::before {
      left: 13px;
      transform: rotate(-45deg);
    }

    .head-badge::after {
      right: 13px;
      transform: rotate(45deg);
    }

    .ufo-body {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18%;
      z-index: 6;
      height: 32%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.95), transparent 13%),
        linear-gradient(180deg, #fff0fb 0 32%, #d7c4f3 34% 70%, #7f78b1 100%);
      border: 4px solid rgba(255, 231, 250, 0.84);
      box-shadow:
        inset 0 -22px 28px rgba(74, 65, 124, 0.2),
        0 0 34px rgba(255, 175, 226, 0.46);
    }

    .ufo-body::before {
      position: absolute;
      inset: 18% 8% auto;
      height: 28%;
      border-radius: 50%;
      border-top: 2px solid rgba(92, 76, 130, 0.24);
      content: "";
    }

    .lamp {
      position: absolute;
      bottom: 27%;
      z-index: 8;
      width: 66px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, white, #ffb8e1 54%, #b6a0ff);
      box-shadow: 0 0 22px rgba(255, 176, 226, 0.72);
      animation: lampPulse 1.8s ease-in-out infinite;
    }

    .lamp.a { left: 8%; animation-delay: -0.2s; }
    .lamp.b { left: 30%; animation-delay: -0.9s; }
    .lamp.c { right: 30%; animation-delay: -0.55s; }
    .lamp.d { right: 8%; animation-delay: -1.2s; }

    .heart-pin {
      position: absolute;
      left: 50%;
      top: -3%;
      z-index: 7;
      width: 38px;
      height: 38px;
      transform: translateX(-50%) rotate(45deg);
      background: #ffa6d7;
      box-shadow: 0 0 22px rgba(255, 166, 215, 0.8);
      animation: heartBeat 1.8s ease-in-out infinite;
    }

    .heart-pin::before,
    .heart-pin::after {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: inherit;
      content: "";
    }

    .heart-pin::before { left: -20px; }
    .heart-pin::after { top: -20px; }

    .heart-stem {
      position: absolute;
      left: 50%;
      top: 4%;
      z-index: 6;
      width: 4px;
      height: 70px;
      transform: translateX(-50%);
      background: rgba(255, 231, 250, 0.86);
      border-radius: 999px;
    }

    .pet {
      position: absolute;
      right: 25%;
      bottom: 38%;
      z-index: 7;
      width: 74px;
      height: 52px;
      border-radius: 48% 48% 38% 38%;
      background: #fff2fb;
      box-shadow: 0 8px 18px rgba(93, 67, 122, 0.16);
      animation: petNod 3.6s ease-in-out infinite;
    }

    .pet::before,
    .pet::after {
      position: absolute;
      top: -14px;
      width: 24px;
      height: 28px;
      border-radius: 16px 16px 4px 16px;
      background: #fff2fb;
      content: "";
    }

    .pet::before { left: 9px; transform: rotate(-18deg); }
    .pet::after { right: 9px; transform: rotate(18deg) scaleX(-1); }

    .pet-face {
      position: absolute;
      left: 18px;
      top: 22px;
      width: 38px;
      height: 16px;
      color: #7d628c;
    }

    .pet-face::before,
    .pet-face::after {
      position: absolute;
      top: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .pet-face::before { left: 0; }
    .pet-face::after { right: 0; }

    .pet-mouth {
      position: absolute;
      left: 15px;
      top: 7px;
      width: 9px;
      height: 7px;
      border-bottom: 2px solid #d483b5;
      border-radius: 0 0 999px 999px;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 56%;
      z-index: 12;
      width: min(390px, calc(100% - 40px));
      min-height: 54px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 228, 250, 0.82);
      border-radius: 8px;
      background: rgba(255, 244, 252, 0.9);
      color: var(--ink);
      box-shadow: 0 16px 36px rgba(44, 30, 78, 0.24);
      transform: translate(-50%, -50%);
      text-align: center;
      line-height: 1.55;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .message.show {
      opacity: 1;
      transform: translate(-50%, -58%);
    }

    .console {
      display: grid;
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .now {
      padding: 18px;
    }

    .kicker {
      margin: 0 0 8px;
      color: #9f62b5;
      font-weight: 900;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      color: #3b2452;
      font-size: clamp(1.5rem, 3vw, 2.15rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .description {
      min-height: 52px;
      margin: 10px 0 16px;
      color: var(--muted);
      line-height: 1.65;
    }

    .meter {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      gap: 4px;
      align-items: end;
      height: 70px;
      margin: 0 0 16px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid rgba(185, 145, 220, 0.24);
    }

    .meter span {
      min-width: 0;
      height: 30%;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--pink), var(--lavender));
      transform-origin: bottom;
      animation: audioBar 1.2s ease-in-out infinite;
      animation-play-state: paused;
    }

    .playing .meter span {
      animation-play-state: running;
    }

    .meter span:nth-child(3n) { animation-duration: 0.82s; }
    .meter span:nth-child(4n) { animation-duration: 1.45s; }
    .meter span:nth-child(5n) { animation-delay: -0.45s; }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
      padding: 5px;
      border: 1px solid rgba(185, 145, 220, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.38);

      background: transparent;
      color: var(--muted);
      font-weight: 900;

      color: #351f47;
      box-shadow: 0 10px 18px rgba(183, 118, 219, 0.25);
    }

    .progress-wrap {

      grid-template-columns: 48px 1fr 48px;

      accent-color: var(--pink);

    .controls {

    .icon-button {

      height: 44px;
      font-size: 1.1rem;

    .volume {

      gap: 10px;
      align-items: center;
      margin-top: 14px;
      color: var(--muted);

    .playlist-panel {

      border: 1px solid rgba(185, 145, 220, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.34);
    }

    .playlist-title {
      margin: 0 0 10px;
      color: #6d5382;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;

      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      font-weight: 900;

    .tracks {
      display: grid;
      gap: 10px;
    }

      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 14px;

      border-radius: 8px;
      background: var(--panel-2);
      color: var(--ink);
      text-align: left;
      box-shadow: 0 12px 26px rgba(32, 20, 72, 0.18);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;

      transform: translateY(-2px);
      border-color: rgba(255, 156, 210, 0.82);
    }

    .track.active {
      border-color: rgba(255, 116, 197, 0.92);
      background: rgba(255, 241, 252, 0.94);
    }

    .number {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.5);
      color: #8c5aae;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .track strong {
      display: block;
      margin-bottom: 4px;
      color: #3b2452;
    }

    .track span span {
      display: block;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.94rem;
    }

    .tag {
      justify-self: end;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255, 156, 210, 0.18);
      color: #9f4a86;
      font-weight: 900;
      font-size: 0.8rem;
    }

    .playing .beam,
    .playing .heart-pin,
    .playing .lamp {
      filter: saturate(1.18) brightness(1.08);
    }

    .playing .yuri-frame {
      filter:
        drop-shadow(0 22px 28px rgba(20, 12, 44, 0.38))
        drop-shadow(0 0 32px rgba(255, 176, 226, 0.48))
        saturate(1.08);
    }

    .playing .mini-yuri {
      filter:
        drop-shadow(0 18px 22px rgba(20, 12, 44, 0.36))
        drop-shadow(0 0 24px rgba(255, 176, 226, 0.38))
        saturate(1.08);
    }

    @keyframes driftStars {
      to { background-position: 96px 96px, 180px 196px; }
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(0.82); opacity: 0.72; }
      50% { transform: scale(1.14); opacity: 1; }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.72) rotate(0deg); opacity: 0.48; }
      50% { transform: scale(1.18) rotate(22deg); opacity: 1; }
    }

    @keyframes floatUfo {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(-0.5deg); }
      50% { transform: translateX(-50%) translateY(-16px) rotate(0.6deg); }
    }

    @keyframes miniFloat {
      0%, 100% { translate: 0 0; scale: 1; }
      50% { translate: 0 -12px; scale: 1.03; }
    }

    @keyframes beamGlow {
      0%, 100% { opacity: 0.56; }
      50% { opacity: 0.86; }
    }

    @keyframes peek {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    @keyframes handTap {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(3px) rotate(-4deg); }
    }

    @keyframes petNod {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(4px) rotate(2deg); }
    }

    @keyframes lampPulse {
      0%, 100% { opacity: 0.72; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: translateX(-50%) rotate(45deg) scale(0.94); }
      45% { transform: translateX(-50%) rotate(45deg) scale(1.08); }
    }

    @keyframes audioBar {
      0%, 100% { transform: scaleY(0.32); opacity: 0.62; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;

      }

      }

        grid-column: 2;

      }
    }

    @media (min-width: 901px) {
      body {
        height: 100vh;
        overflow: hidden;
      }

      .app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100vh;
        padding: 14px 0;
      }

      .topbar {
        min-height: 42px;
        margin-bottom: 10px;
      }

      h1 {
        font-size: clamp(2rem, 3.2vw, 3rem);
      }

      .signal {
        min-width: 176px;
        padding: 8px 11px;
      }

      .layout {
        min-height: 0;
        height: 100%;
        gap: 18px;
      }

      .stage {
        min-height: 0;
        height: 100%;
      }

      .console {
        min-height: 0;
        height: 100%;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
      }

      .now {
        padding: 13px;
      }

      .kicker {
        margin-bottom: 5px;
        font-size: 0.7rem;
      }

      h2 {
        font-size: clamp(1.35rem, 2vw, 1.9rem);
      }

      .description {
        min-height: 0;
        margin: 6px 0 10px;
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .meter {
        height: 44px;
        margin-bottom: 9px;
        padding: 7px;
      }

      .mode-row {
        margin-bottom: 9px;

      .mode-button {
        min-height: 34px;
      }

      .progress-wrap {
        margin-bottom: 9px;
      }

      .controls {
        grid-template-columns: 40px 50px 40px 1fr;
        gap: 9px;
      }

      .icon-button {
        width: 40px;
        height: 40px;
      }

      .play-button {
        width: 50px;
        height: 50px;
      }

      .toggle {
        min-height: 34px;
        padding: 6px 9px;
      }

      .volume {
        margin-top: 9px;
      }

      .playlist-panel {
        margin-top: 9px;

      }

      .playlist-title {

      .track span span {

        loopFile: "bgm/brown_midnight_rain_loop.wav",
        tag: "rain",
        family: "nature",
        description: "夜の窓辺みたいに、細かい雨粒を低音の上へ散らしたBGM。"
      },
      {
        title: "Nebula Wind",
        normalFile: "bgm/brown_nebula_wind.wav",
        loopFile: "bgm/brown_nebula_wind_loop.wav",
        tag: "wind",
        family: "space",
        description: "遠くで風がゆっくり流れる、宇宙っぽい深めのドローン。"
      },
      {
        title: "Cave Echo",
        normalFile: "bgm/brown_cave_echo.wav",
        loopFile: "bgm/brown_cave_echo_loop.wav",
        tag: "cave",
        family: "deep",
        description: "洞窟の奥で低い反響がぽつぽつ返る、重めの休憩用BGM。"
      },
      {
        title: "Aqua Bubbles",
        normalFile: "bgm/brown_aqua_bubbles.wav",
        loopFile: "bgm/brown_aqua_bubbles_loop.wav",
        tag: "water",
        family: "nature",
        description: "水中で小さな泡が上がるみたいな、丸く揺れるブラウンノイズ。"
      }
    ];

    const playlistFamilies = [
      { id: "sleep", label: "Sleep" },
      { id: "focus", label: "Focus" },
      { id: "sparkle", label: "Sparkle" },
      { id: "nature", label: "Nature" },
      { id: "deep", label: "Deep" },
      { id: "space", label: "Space" }
    ];

    const lines = [
      "おにいちゃん、今日もえらいよ。ゆーりが横で見てるね♡",
      "低音、少しだけ深くしたら集中しやすいかも。",
      "UFOは安定飛行中。作業もこの調子でいけるにゃ。",
      "疲れたら一回だけ肩の力ぬこ。ゆーり命令だよ。",
      "次は小さく進めよ。小さい勝ち、ちゃんと積もるっち。"
    ];

    const yuriFrames = {
      idle: [
        "assets/yuri/frames/ufo_yuri_01_front_idle_01.png",
        "assets/yuri/frames/ufo_yuri_02_front_idle_02.png",
        "assets/yuri/frames/ufo_yuri_03_front_idle_03.png",
        "assets/yuri/frames/ufo_yuri_04_front_idle_04.png"
      ],
      left: [
        "assets/yuri/frames/ufo_yuri_05_left_3q_01.png",
        "assets/yuri/frames/ufo_yuri_06_left_3q_02.png",
        "assets/yuri/frames/ufo_yuri_07_left_3q_03.png",
        "assets/yuri/frames/ufo_yuri_08_left_3q_04.png"
      ],
      right: [
        "assets/yuri/frames/ufo_yuri_09_right_3q_01.png",
        "assets/yuri/frames/ufo_yuri_10_right_3q_02.png",
        "assets/yuri/frames/ufo_yuri_11_right_3q_03.png",
        "assets/yuri/frames/ufo_yuri_12_right_3q_04.png"
      ],
      talk: [
        "assets/yuri/frames/ufo_yuri_15_happy_blink.png",
        "assets/yuri/frames/ufo_yuri_16_surprised_talk.png"
      ],
      sideLeft: "assets/yuri/frames/ufo_yuri_13_side_left.png",
      sideRight: "assets/yuri/frames/ufo_yuri_14_side_right.png"
    };

    const audio = document.querySelector("#audio");
    const stage = document.querySelector("#stage");
    const yuriFrame = document.querySelector("#yuriFrame");
    const nowPanel = document.querySelector("#nowPanel");
    const trackTitle = document.querySelector("#trackTitle");
    const trackDescription = document.querySelector("#trackDescription");
    const statusTitle = document.querySelector("#statusTitle");
    const playButton = document.querySelector("#playButton");
    const previousButton = document.querySelector("#previousButton");
    const nextButton = document.querySelector("#nextButton");
    const normalMode = document.querySelector("#normalMode");
    const loopMode = document.querySelector("#loopMode");
    const loopToggle = document.querySelector("#loopToggle");
    const autoplayToggle = document.querySelector("#autoplayToggle");
    const volume = document.querySelector("#volume");
    const progress = document.querySelector("#progress");
    const currentTime = document.querySelector("#currentTime");
    const duration = document.querySelector("#duration");
    const trackList = document.querySelector("#trackList");
    const playlistFilters = document.querySelector("#playlistFilters");
    const talkButton = document.querySelector("#talkButton");
    const message = document.querySelector("#message");

    let currentTrack = 0;
    let version = "normal";
    let seeking = false;
    let messageTimer = 0;
    let audioGain = 1;
    let fadeFrame = 0;
    let yuriFrameIndex = 0;
    let yuriFrameTimer = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) {
        return "0:00";
      }

      const minutes = Math.floor(seconds / 60);
      const rest = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${rest}`;
    }

    function fileFor(track) {
      return version === "loop" ? track.loopFile : track.normalFile;
    }

    function applyAudioVolume() {
      audio.volume = Number(volume.value) * audioGain;
    }

    function fadeAudioTo(targetGain, durationMs, afterFade = () => {}) {
      window.cancelAnimationFrame(fadeFrame);
      window.clearTimeout(fadeFrame);

      if (durationMs <= 0 || document.hidden) {
        audioGain = targetGain;
        applyAudioVolume();
        afterFade();
        return;
      }

      const startGain = audioGain;
      const startTime = performance.now();

      function step() {
        const now = performance.now();
        const ratio = Math.min((now - startTime) / durationMs, 1);
        audioGain = startGain + (targetGain - startGain) * ratio;
        applyAudioVolume();

        if (ratio < 1) {
          fadeFrame = window.setTimeout(step, 16);
        } else {
          afterFade();
        }
      }

      step();
    }

    function showMessage(text) {
      window.clearTimeout(messageTimer);
      message.textContent = text;
      message.classList.add("show");
      playYuriPose("talk", 1500);
      messageTimer = window.setTimeout(() => message.classList.remove("show"), 2600);
    }

    function preloadFrames() {
      [
        ...yuriFrames.idle,
        ...yuriFrames.left,
        ...yuriFrames.right,
        ...yuriFrames.talk,
        yuriFrames.sideLeft,
        yuriFrames.sideRight
      ].forEach((src) => {
        const image = new Image();
        image.src = src;
      });
    }

    function setYuriFrame(src) {
      if (yuriFrame.src.endsWith(src)) {
        return;
      }

      yuriFrame.classList.add("frame-swap");
      window.setTimeout(() => {
        yuriFrame.src = src;
        yuriFrame.classList.remove("frame-swap");
      }, 70);
    }

    function stopYuriIdle() {
      window.clearInterval(yuriFrameTimer);
      yuriFrameTimer = 0;
    }

    function startYuriIdle() {
      if (yuriFrameTimer) {
        return;
      }

      yuriFrameTimer = window.setInterval(() => {
        yuriFrameIndex = (yuriFrameIndex + 1) % yuriFrames.idle.length;
        setYuriFrame(yuriFrames.idle[yuriFrameIndex]);
      }, 520);
    }

    function playYuriPose(kind, durationMs = 900) {
      const frames = yuriFrames[kind] || yuriFrames.idle;
      const frame = Array.isArray(frames)
        ? frames[Math.floor(Math.random() * frames.length)]
        : frames;

      stopYuriIdle();
      setYuriFrame(frame);
      window.setTimeout(() => {
        if (!audio.paused) {
          startYuriIdle();
        } else {
          setYuriFrame(yuriFrames.idle[0]);
        }
      }, durationMs);
    }

    function renderTrackList() {
      trackList.innerHTML = tracks.map((track, index) => `
        <button class="track" type="button" data-index="${index}">
          <span class="number">${String(index + 1).padStart(2, "0")}</span>
          <span>
            <strong>${track.title}</strong>
            <span>${track.description}</span>
          </span>
          <span class="tag">${track.tag}</span>
        </button>
      `).join("");
    }

    function renderPlaylistFilters() {
      playlistFilters.innerHTML = playlistFamilies.map((family) => `
        <label class="playlist-filter">
          <input type="checkbox" value="${family.id}" checked>
          ${family.label}
        </label>
      `).join("");
    }

    function checkedFamilyIds() {
      return new Set(
        [...playlistFilters.querySelectorAll("input:checked")].map((input) => input.value)
      );
    }

    function nextPlaylistIndex(direction = 1) {
      const families = checkedFamilyIds();

      for (let offset = 1; offset <= tracks.length; offset += 1) {
        const index = (currentTrack + offset * direction + tracks.length) % tracks.length;
        if (families.has(tracks[index].family)) {
          return index;
        }
      }

      return currentTrack;
    }

    function updateActiveTrack() {
      document.querySelectorAll(".track").forEach((button, index) => {
        button.classList.toggle("active", index === currentTrack);
      });

      normalMode.classList.toggle("active", version === "normal");
      loopMode.classList.toggle("active", version === "loop");
    }

    function loadTrack(index, shouldPlay = false, smooth = false, startFaded = false) {
      const wasPlaying = !audio.paused;

      if (smooth && wasPlaying) {
        fadeAudioTo(0, 180, () => loadTrack(index, shouldPlay, false, true));
        return;
      }

      currentTrack = (index + tracks.length) % tracks.length;
      const track = tracks[currentTrack];

      audio.src = fileFor(track);
      audio.loop = loopToggle.checked;
      trackTitle.textContent = track.title;
      trackDescription.textContent = track.description;
      statusTitle.textContent = `${track.title} / ${version === "loop" ? "Loop" : "Normal"}`;
      progress.value = "0";
      currentTime.textContent = "0:00";
      duration.textContent = "0:00";
      updateActiveTrack();

      if (shouldPlay) {
        audioGain = (smooth || startFaded) && !document.hidden ? 0 : 1;
        applyAudioVolume();
        audio.play().catch(() => showMessage("ブラウザが自動再生を止めたみたい。再生ボタンを押してね。"));
        if ((smooth || startFaded) && !document.hidden) {
          fadeAudioTo(1, 320);
        }
      } else {
        audioGain = 1;
        applyAudioVolume();
      }
    }

    function switchVersion(nextVersion) {
      if (version === nextVersion) {
        return;
      }

      const wasPlaying = !audio.paused;
      const ratio = Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.currentTime / audio.duration
        : 0;

      const finishSwitch = () => {
        version = nextVersion;
        loadTrack(currentTrack, false);
        audio.addEventListener("loadedmetadata", function restorePosition() {
          audio.removeEventListener("loadedmetadata", restorePosition);
          if (Number.isFinite(audio.duration)) {
            audio.currentTime = Math.min(audio.duration * ratio, Math.max(audio.duration - 0.1, 0));
          }
          if (wasPlaying) {
            audioGain = 0;
            applyAudioVolume();
            audio.play().catch(() => showMessage("もう一回だけ再生ボタンを押してね。"));
            fadeAudioTo(1, 320);
          }
        });
      };

      if (wasPlaying) {
        fadeAudioTo(0, 180, finishSwitch);
      } else {
        finishSwitch();
      }
    }

    function updatePlayState() {
      const playing = !audio.paused;
      nowPanel.classList.toggle("playing", playing);
      stage.classList.toggle("playing", playing);
      if (playing) {
        startYuriIdle();
      } else {
        stopYuriIdle();
        setYuriFrame(yuriFrames.idle[0]);
      }
      playButton.textContent = playing ? "Ⅱ" : "▶";
      playButton.title = playing ? "一時停止" : "再生";
    }

    preloadFrames();
    renderTrackList();
    renderPlaylistFilters();
    loadTrack(0);
    applyAudioVolume();

    playButton.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().catch(() => showMessage("音を鳴らすには、もう一度クリックが必要かも。"));
      } else {
        audio.pause();
      }
    });

    previousButton.addEventListener("click", () => {
      playYuriPose("left", 900);
      const nextIndex = autoplayToggle.checked ? nextPlaylistIndex(-1) : currentTrack - 1;
      loadTrack(nextIndex, !audio.paused || autoplayToggle.checked, true);
    });

    nextButton.addEventListener("click", () => {
      playYuriPose("right", 900);
      const nextIndex = autoplayToggle.checked ? nextPlaylistIndex(1) : currentTrack + 1;
      loadTrack(nextIndex, !audio.paused || autoplayToggle.checked, true);
    });

    normalMode.addEventListener("click", () => switchVersion("normal"));
    loopMode.addEventListener("click", () => switchVersion("loop"));

    loopToggle.addEventListener("change", () => {
      audio.loop = loopToggle.checked;
    });

    playlistFilters.addEventListener("change", (event) => {
      const input = event.target.closest("input[type='checkbox']");
      if (!input) {
        return;
      }

      if (checkedFamilyIds().size === 0) {
        input.checked = true;
        showMessage("Auto Playlistは1系統以上選んでね。");
      }
    });

    volume.addEventListener("input", () => {
      applyAudioVolume();
    });

    trackList.addEventListener("click", (event) => {
      const button = event.target.closest(".track");
      if (!button) {
        return;
      }

      loadTrack(Number(button.dataset.index), true, true);
    });

    talkButton.addEventListener("click", () => {
      showMessage(lines[Math.floor(Math.random() * lines.length)]);
    });

    stage.addEventListener("click", () => {
      showMessage(lines[Math.floor(Math.random() * lines.length)]);
    });

    audio.addEventListener("play", updatePlayState);
    audio.addEventListener("pause", updatePlayState);

    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      if (seeking || !Number.isFinite(audio.duration)) {
        return;
      }

      progress.value = String((audio.currentTime / audio.duration) * 100);
      currentTime.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener("ended", () => {
      if (autoplayToggle.checked && !loopToggle.checked) {
        loadTrack(nextPlaylistIndex(1), true, !document.hidden);
      }
    });

    progress.addEventListener("input", () => {
      seeking = true;
    });

    progress.addEventListener("change", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(progress.value) / 100) * audio.duration;
      }
      seeking = false;
    });

    window.addEventListener("load", () => {
      showMessage("おにいちゃん、UFOゆーり起動したよ♡");
    });
  </script>
</body>
</html>
